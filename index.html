<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参数单生成器 · 数据管理</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ec; --txt:#1f2430; --sub:#6b7280;
    --pri:#2563eb; --pri-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --grp:#f0f4ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);padding:0 0 60px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
  header h1{font-size:16px;font-weight:700;margin-right:8px}
  header .spacer{flex:1}
  .btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:#c7cdd8;background:#fafbfc}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn.pri:hover{background:var(--pri-d)}
  .btn.danger{color:var(--danger);border-color:#fbc4c4}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:4px 10px;font-size:12px}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap}
  .bar select,.bar input[type=text]{padding:7px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;min-width:200px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .grp>.hd{background:var(--grp);padding:11px 16px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;border-bottom:1px solid var(--line)}
  .grp>.hd .arw{font-size:11px;color:var(--sub);transition:.2s;display:inline-block}
  .grp.collapsed>.hd .arw{transform:rotate(-90deg)}
  .grp.collapsed>.bd{display:none}
  .grp>.hd .cnt{margin-left:auto;font-weight:400;color:var(--sub);font-size:12px}
  .bd{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px}
  .bd.one{grid-template-columns:1fr}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;color:var(--sub);font-weight:500}
  .fld input,.fld textarea{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;width:100%}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .fld textarea{resize:vertical;min-height:64px;line-height:1.5}
  /* 单位固定：输入框右侧(或左侧)常显单位，用户只填数字 */
  .urow{display:flex;align-items:center;gap:6px}
  .urow input{flex:1;min-width:0}
  .upre{font-size:13px;color:#464B52;font-weight:600;white-space:nowrap}
  .usuf{font-size:13px;color:#464B52;font-weight:600;white-space:nowrap;min-width:18px}
  .fld select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;width:100%}
  .fld select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .sub-h{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--pri);margin-top:6px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
  .sub-h:first-child{margin-top:0}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-column:1/-1}
  .imgbox{display:flex;gap:16px;align-items:center;grid-column:1/-1}
  .imgbox .ph{width:150px;height:110px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#b6bcc8;font-size:12px;background:#fafbfc;overflow:hidden}
  .imgbox .ph img{width:100%;height:100%;object-fit:contain}
  .hint{font-size:12px;color:var(--sub);line-height:1.7}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2430;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
  .empty{text-align:center;color:var(--sub);padding:50px 0}
  .badge{display:inline-block;background:#eef2ff;color:var(--pri);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600}
  .freqbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;flex-wrap:wrap}
  .fbtn{border:1px solid var(--line);background:#fff;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub)}
  .fbtn.on{background:var(--pri);border-color:var(--pri);color:#fff}
  /* ===== UI 优化 2026-10-19 ===== */
  .vsep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .hdr-lang{display:flex;align-items:center;gap:6px}
  .btn.pri2{background:#eef2ff;border-color:#c7d2fe;color:var(--pri-d);font-weight:600}
  .btn.pri2:hover{background:#e0e7ff}
  .barlbl{font-size:12px;color:var(--sub);font-weight:600}
  /* 进度条 */
  .prog{max-width:1100px;margin:0 auto 4px;padding:0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prog .pbar{flex:1;min-width:180px;height:8px;background:#e6e9f0;border-radius:5px;overflow:hidden}
  .prog .pbar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:5px;transition:width .3s}
  .prog .pbar.full i{background:linear-gradient(90deg,#4ade80,#16a34a)}
  .prog .txt{font-size:12px;color:var(--sub);white-space:nowrap}
  .prog .txt b{color:var(--pri);font-size:13px}
  .prog .miss{font-size:11.5px;color:var(--warn);cursor:pointer;text-decoration:underline dotted}
  /* 分组头：序号徽标 + 页签提示 */
  .grp>.hd .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;font-size:11px;font-weight:700}
  .grp>.hd .pg{margin-left:6px;font-size:11px;font-weight:500;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px}
  /* 子标题更轻 */
  .sub-h{display:flex;align-items:center;gap:6px}
  .sub-h::before{content:"";width:3px;height:12px;background:var(--pri);border-radius:2px}
  /* 必填提示 */
  .fld.req label::after{content:"*";color:var(--danger);margin-left:3px}
  /* 聚焦高亮分组 */
  .grp.flash{box-shadow:0 0 0 2px rgba(37,99,235,.35)}
  @media (max-width:720px){
    header{gap:8px;padding:10px 12px}
    header h1{font-size:15px}
    .bar{padding:10px 12px;gap:8px}
    .bar select{min-width:140px}
    .wrap,.prog{padding:0 12px}
    .bd{grid-template-columns:1fr;padding:12px}
    .imgbox{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<header>
  <h1>参数单生成器</h1>
  <span class="badge">V2</span>
  <span class="spacer"></span>
  <label class="hint hdr-lang">语言
    <select id="selLang" style="min-width:auto;padding:6px 10px">
      <option value="en" selected>English</option>
      <option value="zh">中文</option>
    </select>
  </label>
  <span class="vsep"></span>
  <button class="btn" onclick="uploadDatasheet()" title="上传 PDF/图片自动识别">📎 Datasheet</button>
  <button class="btn" onclick="importJson()">导入</button>
  <button class="btn" onclick="exportJson()">导出</button>
  <button class="btn" onclick="save()">保存</button>
  <span class="vsep"></span>
  <button class="btn pri" onclick="genFile('pdf')">⬇ 导出 PDF</button>
  <button class="btn pri2" onclick="genFile('pptx')">PPTX</button>
</header>

<div class="bar">
  <span class="barlbl">机型</span>
  <select id="selModel" onchange="switchModel(this.value)"></select>
  <button class="btn sm" onclick="newModel()">+ 新建</button>
  <button class="btn sm" onclick="dupModel()">复制</button>
  <button class="btn sm danger" onclick="delModel()">删除</button>
  <span class="spacer"></span>
  <span class="hint" id="status">数据保存在浏览器本地</span>
</div>

<!-- 填充进度：一眼看出还差哪些必填项 -->
<div class="prog" id="prog"></div>

<div class="wrap" id="form"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 字段定义（分组 = 模板模块） ================= */
/* 随频率变化的字段（放 freqs[频率]）；其余字段放 common */
const FREQ_FIELDS = ['freq','prp_kva','eps_kva','prp_kw','eps_kw',
                     'rpm','fc_esp','fc_prp','fc_75','fc_50'];

/* 只保留模板中标注了 12345 的格子；其余格子（含第3、4页）一律保持模板原值不动。
   分三类：机组 / 动力 / 电机 */
const GROUPS = [
 /* 顺序严格对应模板：第1页(功率→排量尺寸→声压级→动力概览) → 第2页(动力详参→电机) → 图片 */
 {id:'basic', t:'① 机组 · 第1页', open:true, fields:[
   {k:'model',  t:'机组型号（图片文件名）', ph:'例: D17'},
   {k:'__sub',  t:'标题旁型号字', ph:'AS500E5'},
   {k:'title',  t:'大标题（留空=自动）', ph:'Industrial Range Powered By X'},
   {sub:'功率 (Power)'},
   {k:'prp_kva',t:'PRP 功率', unit:'kVA'}, {k:'eps_kva',t:'EPS 功率', unit:'kVA'},
   {k:'prp_kw', t:'PRP 功率', unit:'kW'},  {k:'eps_kw', t:'EPS 功率', unit:'kW'},
   {k:'freq',   t:'频率 / 相数 / 功率因数', ph:'50Hz / 3P / PF0.8'},
   {k:'std_v',  t:'标准电压', ph:'400/230V'},
   {k:'opt_v',  t:'可用电压', ph:'380/220V · 415/240V'},
   {sub:'外观尺寸 (Dimension / Weight / Fuel tank)'},
   {k:'o_lwh',t:'开架 尺寸 L×W×H'},{k:'o_wt',t:'开架 重量',unit:'kg'},
   {k:'o_tank',t:'开架 油箱',unit:'L'},
   {k:'s_lwh',t:'静音 尺寸 L×W×H'},{k:'s_wt',t:'静音 重量',unit:'kg'},
   {k:'s_tank',t:'静音 油箱',unit:'L'},
   {sub:'声压级 dB(A) @75% load'},
   {k:'o_db1',t:'开架 1m'},{k:'o_db7',t:'开架 7m'},
   {k:'s_db1',t:'静音 1m'},{k:'s_db7',t:'静音 7m'},
   {sub:'动力概览 (Performance data)'},
   {k:'e_brand',t:'发动机品牌'},{k:'e_model',t:'发动机型号'},
   {k:'e_fuel',t:'燃料'},{k:'e_asp',t:'进气方式'},
   {k:'e_cool',t:'冷却方式'},{k:'e_gov',t:'调速器'},
   {k:'e_cyl',t:'气缸排列'},
   {sub:'油耗 (L/H)'},
   {k:'fc_esp',t:'100% ESP'},{k:'fc_prp',t:'100% PRP'},
   {k:'fc_75',t:'75% PRP'},{k:'fc_50',t:'50% PRP'},
 ]},
 {id:'perf', t:'② 动力详参 · 第2页', open:true, fields:[
   {sub:'基础数据 (Basic data)'},
   {k:'displ',t:'排量', ph:'16.25',unit:'L'},{k:'cyl_arr',t:'缸数 / 排列', ph:'6L'},
   {k:'bore',t:'缸径×行程', ph:'142x171'},{k:'rpm',t:'转速', ph:'1500',unit:'rpm'},
   {sub:'排气系统 (Exhaust)'},
   {k:'ex_t',t:'排气温度 (max)', ph:'560',unit:'°C'},
   {k:'ex_f',t:'排气流量 (max) — 连单位输入', ph:'107.5m³/min'},
   {k:'ex_bp',t:'排气背压 (最大允许) — 连单位输入', ph:'5.0kPa'},
   {sub:'燃油系统 (Fuel)'},
   {k:'fu_res',t:'输油泵阻力 — 连单位输入', ph:'19.6kPa'},
   {k:'fu_max',t:'最大燃油流量 — 连单位输入', ph:'131L/H'},
   {sub:'冷却系统 (Cooling)'},
   {k:'co_air',t:'散热器空气流量 — 连单位输入', ph:'540m³/min'},
   {k:'co_oil',t:'机油总容量', ph:'30',unit:'L'},
   {k:'co_cool',t:'冷却液总容量', ph:'27',unit:'L'},
   {sub:'进气系统 (Inlet air)'},
   {k:'in_flt',t:'空滤类型', ph:'Dry type'},
   {k:'in_res',t:'最大进气阻力 — 连单位输入', ph:'5.0kPa'},
   {k:'in_flow',t:'燃烧空气流量 — 连单位输入', ph:'560L/S'},
   {k:'in_t',t:'最高进气温度', ph:'50',unit:'°C'},
   {sub:'电气系统 (Electrical)'},
   {k:'el_v',t:'起动机额定电压', ph:'24',unit:'DC',unitPos:'pre'},
   {k:'el_bat',t:'启动电池（个数 / 容量Ah / CCA）', ph:'2 / 60 / 720',va:'batt'},
   {k:'el_alt',t:'充电发电机（电压 / 电流A）', ph:'24 / 40',unit:'DC',unitPos:'pre',amp:true},
 ]},
 {id:'gen', t:'③ 电机 · 第2页', open:false, fields:[
   {sub:'基本数据 (Basic data)'},
   {k:'g_insul',t:'绝缘 / 温升', ph:'H',insulFixed:'H'},
   {k:'g_exc',t:'励磁方式', ph:'请选择',opts:['Self-excited','PMG','Separately excited']},
   {k:'g_lead',t:'绕组出线', ph:'12'},
   {k:'g_conn',t:'绕组接法(标准)', ph:'请选择',opts:['Star','Delta']},
   {k:'g_pitch',t:'绕组节距', ph:'请选择',opts:['Two thirds','Five sixths'],defv:'Two thirds'},
   {k:'g_phase',t:'相数', ph:'请选择',opts:['Single phase','Three phase'],defv:'Three phase'},
   {sub:'结构 (Structure)'},
   {k:'g_brg',t:'轴承数', ph:'请选择',opts:['Single bearing','Double bearing'],defv:'Single bearing'},
 ]},
 {id:'img', t:'④ 机组图片', open:true, fields:[
   {sub:'开架机组 OPEN'},
   {k:'__img_open', t:'开架图', imgv:'open'},
   {sub:'静音机组 SILENT'},
   {k:'__img_silent', t:'静音图', imgv:'silent'},
 ]},
];

/* API 基址：取当前页面所在目录（如 /paramsheet/），避免末尾无斜杠时相对路径解析错误 */
const API_BASE = (function(){
  let p = location.pathname;
  if(!p.endsWith('/')) p = p.substring(0, p.lastIndexOf('/')+1);
  return p;   // 形如 /paramsheet/
})();

/* ================= 存储 =================
   机型结构（V2 双频）：
   { model, curFreq:'50Hz'|'60Hz', freqs:{ '50Hz':{随频率字段}, '60Hz':{...} }, common:{其余字段} }
   兼容旧结构：{ model, ...扁平字段 } -> 自动迁移到 freqs['50Hz'] + common */
const LS_KEY='paramsheet_db_v2';
let DB = load();
let cur = DB.models.length ? DB.models[0].model : null;

function load(){
  try{ const s=localStorage.getItem(LS_KEY); if(s) return migrate(JSON.parse(s)); }catch(e){}
  // 尝试从旧 key 迁移
  try{ const o=localStorage.getItem('paramsheet_db_v1'); if(o) return migrate(JSON.parse(o)); }catch(e){}
  return {models:[{model:'D17', curFreq:'50Hz', freqs:{'50Hz':{}}, common:{model:'D17'}}]};
}
function migrate(db){
  if(!db||!db.models) return db;
  db.models.forEach(m=>{
    if(!m.freqs){
      const f={}, c={};
      Object.keys(m).forEach(k=>{
        if(k==='model'||k==='freqs'||k==='common'||k==='curFreq') return;
        if(FREQ_FIELDS.includes(k)) f[k]=m[k]; else c[k]=m[k];
      });
      m.freqs={}; m.freqs[m.curFreq||'50Hz']=f; m.common=c; m.curFreq=m.curFreq||'50Hz';
      Object.keys(m).forEach(k=>{ if(k!=='model'&&k!=='freqs'&&k!=='common'&&k!=='curFreq') delete m[k]; });
    }
    if(!m.common) m.common={};
    if(!m.curFreq) m.curFreq=Object.keys(m.freqs)[0]||'50Hz';
  });
  return db;
}
function curFreqData(m){
  m = m || findModel(cur);
  if(!m) return {};
  if(!m.freqs) return {};
  if(!m.freqs[m.curFreq]){
    // 当前频率没数据 -> 自动切到有的那个
    const avail=Object.keys(m.freqs);
    m.curFreq = avail[0] || '50Hz';
  }
  return m.freqs[m.curFreq] || {};
}
function availFreqs(m){ m=m||findModel(cur); return m && m.freqs ? Object.keys(m.freqs) : []; }

function save(){
  save_soft();
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  toast('已保存');
}
function findModel(name){ return DB.models.find(x=>x.model===name); }

/* ================= 表单渲染 ================= */
function cleanVal(v){
  // 统一清洗：去首尾空白、多空格压成一个、去空行（保留换行使多行字段正常）
  return String(v==null?'':v)
    .split('\n').map(x=>x.replace(/[ \t\u00a0]+/g,' ').trim())
    .filter((x,i,arr)=> !(x==='' && (i===0||i===arr.length-1)) )   // 只去首尾空行
    .join('\n');
}
function collect(){
  const o={};
  document.querySelectorAll('[data-k]').forEach(el=>{ o[el.dataset.k]=cleanVal(el.value); });
  // 组合字段拼回：电池三段 / 充电发电机两段
  const g = k => String(o[k]||'').trim();
  const n=g('el_bat_n'), ah=g('el_bat_ah'), cca=g('el_bat_cca');
  if(n||ah||cca) o.el_bat = `${n||''}X${ah||''}Ah(${cca||''}CCA)`;
  delete o.el_bat_n; delete o.el_bat_ah; delete o.el_bat_cca;
  const av=g('el_alt_v'), aa=g('el_alt_a');
  if(av||aa) o.el_alt = `DC${av||''}V/${aa||''}A`;
  delete o.el_alt_v; delete o.el_alt_a;
  return o;
}

/* ===== 出件前归一：把"数字 + 固定单位"拼成模板要的完整字符串 =====
   只在导出时使用，不改用户填的原始数字，重复导出不会叠加单位。 */
function normalizeUnits(src){
  const d = Object.assign({}, src||{});
  const set = (k, unit, opt) => {
    let v = String(d[k]==null?'':d[k]).trim();
    if(!v) return;
    if(v.replace(/\s/g,'')==='TBA') return;                 // TBA 不补单位
    if(opt && opt.upper) v = v.toUpperCase();
    if(opt && opt.alreadyRe && opt.alreadyRe.test(v)) return; // 已带单位不重复补
    d[k] = v + (opt && opt.space ? ' ' : '') + unit;
  };
  // 后缀固定
  set('prp_kva','kVA',{space:true,alreadyRe:/kVA$/i});
  set('eps_kva','kVA',{space:true,alreadyRe:/kVA$/i});
  set('prp_kw','kW',{space:true,alreadyRe:/kW$/i});
  set('eps_kw','kW',{space:true,alreadyRe:/kW$/i});
  set('o_wt','kg',{space:true,upper:true,alreadyRe:/kg$/i});
  set('s_wt','kg',{space:true,upper:true,alreadyRe:/kg$/i});
  set('o_tank','L',{space:true,lower:true,alreadyRe:/L$/});
  set('s_tank','L',{space:true,lower:true,alreadyRe:/L$/});
  set('displ','L',{space:true,alreadyRe:/L$/});
  set('rpm','rpm',{space:true,alreadyRe:/rpm$/i});
  set('ex_t','°C',{space:true,alreadyRe:/(°C|℃)$/});
  set('in_t','°C',{space:true,alreadyRe:/(°C|℃)$/});
  set('co_oil','L',{space:true,alreadyRe:/L$/});
  set('co_cool','L',{space:true,alreadyRe:/L$/});
  // 前缀固定
  const pre = (k, prefix) => {
    let v = String(d[k]==null?'':d[k]).trim();
    if(!v) return;
    if(/^DC/i.test(v) || /^Class/i.test(v)) return;
    d[k] = prefix + v;
  };
  // 起动机电压：24 -> DC24V
  {
    let v = String(d.el_v==null?'':d.el_v).trim().toUpperCase().replace(/\s/g,'');
    if(v){ if(!/^DC/.test(v)) v='DC'+v; if(!/V$/.test(v)) v+='V'; d.el_v=v; }
  }
  // 绝缘/温升：Class H/[温升]（绝缘固定 H，只取温升段）
  {
    const r = insulRise(d.g_insul) || 'H';
    d.g_insul = 'Class H/' + r;
  }
  return d;
}

/* 下拉选项：中文环境转中文，英文环境用英文（模板是英文） */
const OPT_ZH = {
  'Self-excited':'自励磁', 'PMG':'永磁(PMG)', 'Separately excited':'他励',
  'Star':'星形(Y)', 'Delta':'三角形(Δ)',
  'Two thirds':'2/3', 'Five sixths':'5/6',
  'Single phase':'单相', 'Three phase':'三相',
  'Single bearing':'单轴承', 'Double bearing':'双轴承'
};
function optLabel(v, lang){
  if(!v) return v;
  if(lang==='zh' && OPT_ZH[v]) return OPT_ZH[v];
  if(lang==='en'){   // 中文存量值反查英文
    for(const k in OPT_ZH){ if(OPT_ZH[k]===v) return k; }
  }
  return v;
}
/* 把表单值按频率/共用写回机型 */
function applyCollect(m, vals){
  if(!m) return;
  m.freqs = m.freqs || {};
  m.common = m.common || {};
  const fd = m.freqs[m.curFreq] = m.freqs[m.curFreq] || {};
  Object.keys(vals).forEach(k=>{
    if(k==='model'){ m.model = String(vals[k]||'').trim(); m.common.model = m.model; return; }
    if(k==='__sub'){ m.common.__sub = vals[k]; return; }   // 标题旁型号字：存 common
    if(k.startsWith('__')) return;              // __img_* 等元字段不进数据
    // 组合字段的中间键（电池三段 / 充电机两段）：不进数据，由 collect() 拼成 el_bat / el_alt
    if(['el_bat_n','el_bat_ah','el_bat_cca','el_alt_v','el_alt_a'].includes(k)) return;
    if(FREQ_FIELDS.includes(k)) fd[k]=vals[k]; else m.common[k]=vals[k];
  });
}
/* 型号唯一键：取 common.model 或旧 data.model；trim 防空格导致 findModel 失配 */
function curModelName(m){
  if(!m) return '';
  const v = (m.common && m.common.model) || m.model || '';
  return String(v).trim();
}
/* 从表单读「机组型号」输入框，实时同步给当前机型（关键修复） */
function syncModelFromForm(){
  const el = document.querySelector('[data-k="model"]');
  if(!el) return;
  const v = String(el.value||'').trim();
  const m = findModel(cur);
  if(!m) return;
  if(v && v!==m.model && !findModel(v)){
    m.model = v; m.common = m.common||{}; m.common.model = v;   // 改名（图片文件名也随 model 走）
    cur = v;
    const sel=document.getElementById('selModel');
    if(sel){ sel.innerHTML = DB.models.map(x=>`<option ${x.model===cur?'selected':''}>${esc(x.model)}</option>`).join(''); }
  }
  renderListNames();
}

/* 切换频率：先把当前表单存回，再换频率渲染 */
function switchFreq(f){
  const m=findModel(cur); if(!m) return;
  applyCollect(m, collect());
  m.curFreq = f;
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  renderForm();
  toast('已切换到 '+f);
}
/* 添加频率（50Hz/60Hz 互斥，已有则不重复） */
function addFreq(){
  const m=findModel(cur); if(!m) return;
  m.freqs = m.freqs || {};
  const opts = ['50Hz','60Hz'].filter(f=>!m.freqs[f]);
  if(!opts.length) return alert('50Hz 和 60Hz 都有了');
  const f = opts.length===1 ? opts[0] : (prompt('添加频率（50Hz 或 60Hz）：', '60Hz')||'').trim();
  if(!f) return;
  if(!/^(50|60)Hz$/.test(f)) return alert('只能是 50Hz 或 60Hz');
  if(m.freqs[f]) return alert(f+' 已存在');
  applyCollect(m, collect());
  m.freqs[f] = {};
  m.curFreq = f;
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  renderForm();
  toast('已添加 '+f);
}

/* ===== 单位固定：显示层辅助 =====
   原则：输入框右侧（或左侧）单位常显，用户只填数字；
   出件前由 normalizeUnits() 统一拼回 "值+单位" 再交给后端。 */

/* 绝缘/温升：模板是 Class H/H（绝缘/温升）。绝缘固定 H，只让用户改温升段。 */
function insulRise(v){
  const t=String(v||'').trim();
  if(!t) return '';
  const m=t.match(/^\s*Class\s*[A-Z]\s*\/\s*([A-Z])\s*$/i);   // Class H/F
  if(m) return m[1].toUpperCase();
  if(/^[A-Z]$/i.test(t)) return t.toUpperCase();                  // 只填了 H
  return t;                                                       // 其它原样
}

function battHTML(v){
  // 兼容旧值：2x60Ah(720CCA) / 2x60Ah(580CCA)
  let n='',ah='',cca='';
  const m=String(v||'').replace(/\s/g,'').match(/^(\d+)[xX×](\d+)[Aa][Hh]?\(?(\d+)[Cc][Cc][Aa]?\)?$/);
  if(m){ n=m[1]; ah=m[2]; cca=m[3]; }
  else { const parts=String(v||'').split('/').map(x=>x.trim()); n=parts[0]||''; ah=parts[1]||''; cca=parts[2]||''; }
  return `<input type="text" data-k="el_bat_n" value="${esc(n)}" placeholder="2" style="flex:1">
    <span class="usuf">X</span>
    <input type="text" data-k="el_bat_ah" value="${esc(ah)}" placeholder="60" style="flex:1">
    <span class="usuf">Ah(</span>
    <input type="text" data-k="el_bat_cca" value="${esc(cca)}" placeholder="720" style="flex:1">
    <span class="usuf">CCA)</span>`;
}
function altPart(v, which){
  const m=String(v||'').replace(/^DC/i,'').replace(/\s/g,'').match(/^(\d+)[Vv]?[\/]?(\d*)/);
  if(!m) return '';
  return which==='v' ? m[1] : (m[2]||'');
}

function renderForm(){
  const m = findModel(cur) || {model:''};
  const fd = curFreqData(m);          // 当前频率数据

  const el = document.getElementById('form');

    </div>` : `<div class="freqbar"><span class="hint">无频率数据</span>

  el.innerHTML = freqBar + GROUPS.map(g=>{

            <button class="btn sm" type="button" onclick="clearLocalImg('${f.imgv}')">恢复自动匹配</button>
          </div></div></div>`;
      const v = esc(valOf(f.k));
      if(f.ta) return `<div class="fld" style="grid-column:1/-1"><label>${f.t}</label>
        <textarea data-k="${f.k}" placeholder="${f.ph||''}">${v}</textarea></div>`;
      const oninp = (f.k==='model') ? ' oninput="syncModelFromForm()"' : '';
      // 下拉框（固定选项，出件时按语言映射成英文/中文）
      if(f.opts){
        const cur0 = (valOf(f.k)||'').trim() || (f.defv||'');

        <div class="urow">${battHTML(v)}</div></div>`;
      // 绝缘/温升：Class H/[温升] —— 前段 Class H 固定，只改温升等级
      if(f.insulFixed){
        const cur1 = insulRise(valOf(f.k)) || 'H';
        return `<div class="fld"><label>${f.t}</label>
          <div class="urow"><span class="upre">Class ${esc(f.insulFixed)}/</span>
            <input type="text" data-k="${f.k}" value="${esc(cur1)}" placeholder="H" style="flex:1"></div></div>`;
      }
      // 带前缀单位（DCxxV / Class X/H）

              <input type="text" data-k="${f.k}_v" value="${esc(altPart(v,'v'))}" placeholder="24" style="flex:1">
              <span class="usuf">V /</span>

        return `<div class="fld"><label>${f.t}</label>
          <div class="urow"><span class="upre">${esc(f.unit)}</span>

      }

      if(f.unit) return `<div class="fld"><label>${f.t}</label>

  autoShowImg('open'); autoShowImg('silent');
  updateProgress();
  // 事件委托：任何字段变动 -> 刷新进度条 + 标记未保存（不重渲染表单，避免丢焦点）
  if(!el._bound){
    el._bound = true;
    el.addEventListener('input', onFieldChange);

let _dirtyTimer = null;
function onFieldChange(){
  // 先把当前表单写回内存数据，否则进度条读到的还是旧数据
  const m0 = findModel(cur);
  if(m0){ try{ applyCollect(m0, collect()); }catch(e){} }
  updateProgress();
  const st = document.getElementById('status');
  if(st && !st.dataset.orig) st.dataset.orig = st.textContent;
  if(st){ st.textContent = '● 有改动未保存'; st.style.color = 'var(--warn)'; }
  clearTimeout(_dirtyTimer);
  _dirtyTimer = setTimeout(()=>{ try{ save_soft(); }catch(e){} }, 1500);  // 1.5s 后自动暂存
  setTimeout(()=>{
    const s2=document.getElementById('status');
    if(s2 && s2.textContent.startsWith('●')){ s2.textContent='✓ 已自动暂存'; s2.style.color='var(--ok)';
      setTimeout(()=>{ if(s2.textContent==='✓ 已自动暂存'){ s2.textContent=s2.dataset.orig||''; s2.style.color=''; } }, 2000); }
  }, 1700);
}

/* ===== 填充进度 =====
   只看「模板里有 12345 的格子」对应的字段；图片不算必填。 */
const KEY_REQUIRED = ['model','prp_kva','prp_kw','eps_kva','eps_kw','freq','std_v'];
function updateProgress(){
  const box = document.getElementById('prog');
  if(!box) return;
  const m = findModel(cur) || {};
  const fd = curFreqData(m), cm = m.common||{};
  const valOf = k => FREQ_FIELDS.includes(k) ? (fd[k]||'') : (cm[k]||'');
  // 组合字段：任一子段有值即算已填
  const comboVal = k => {
    if(k==='el_bat') return [cm.el_bat_n,cm.el_bat_ah,cm.el_bat_cca].filter(Boolean).join('');
    if(k==='el_alt') return [cm.el_alt_v,cm.el_alt_a].filter(Boolean).join('');
    return valOf(k);
  };
  let all=0, filled=0; const miss=[];
  GROUPS.forEach(g=>{
    if(g.id==='img') return;
    g.fields.forEach(f=>{
      if(f.sub||f.imgv) return;
      if(String(f.k).startsWith('__')) return;      // 标题旁型号字等元字段不计入进度
      if(f.k==='title') return;                     // 大标题留空=自动生成，不算必填
      all++;
      const v=String((f.va?comboVal(f.k):valOf(f.k))||'').trim();
      if(v) filled++; else miss.push({k:f.k, t:f.t, gid:g.id});
    });
  });
  const pct = all? Math.round(filled*100/all) : 0;
  // 只列出前 5 个缺失项，点一下跳到对应分组
  const missHTML = miss.length
    ? `<span class="miss" onclick="jumpTo('${miss[0].gid}')" title="${esc(miss.map(x=>x.t).join('、'))}">缺 ${miss.length} 项，点击定位：${esc(miss[0].t)}</span>`
    : `<span class="txt" style="color:var(--ok)">✓ 全部字段已填</span>`;
  box.innerHTML = `<div class="pbar ${pct===100?'full':''}"><i style="width:${pct}%"></i></div>
    <span class="txt">已填 <b>${filled}</b>/${all} · ${pct}%</span>${missHTML}`;
}

/* ===== 图片：自动匹配 / 手动选择 / 上传 =====
   优先级：本地手选(dataURL) > 图片库自动匹配 > 暂无
   本地手选仅存浏览器，导出时随 payload 带给后端 */
let localImgs = {};  // {open: dataURL, silent: dataURL}

function autoShowImg(kind){
  const p=document.getElementById('imgph-'+kind); if(!p) return;
  const st=document.getElementById('imgstat-'+kind); if(st) st.textContent='';
  // 本地手选优先
  if(localImgs[kind]){
    p.innerHTML='';
    const im=new Image(); im.src=localImgs[kind]; p.appendChild(im);
    if(st) st.textContent='（本地手选，未入库）';
    return;
  }
  const model=cur;
  if(!model){ p.innerHTML='<span style="color:#b6bcc8">无型号</span>'; return; }
  p.innerHTML='<span style="color:#b6bcc8">…</span>';
  const exts=['png','jpg'];
  let i=0;
  (function tryNext(){
    if(i>=exts.length){ p.innerHTML='暂无图片<br><span style="font-size:10px;color:#b6bcc8">'+esc(model)+'_'+kind.toUpperCase()+'</span>';
      if(st) st.textContent='未找到，可手动选择/上传'; return; }
    const url='images/'+encodeURIComponent(model)+'_'+kind.toUpperCase()+'.'+exts[i];
    const img=new Image();
    img.onload=()=>{ p.innerHTML=''; p.appendChild(img); if(st) st.textContent='已匹配 '+model+'_'+kind.toUpperCase()+'.'+exts[i]; };
    img.onerror=()=>{ i++; tryNext(); };
    img.src=url+'?t='+Date.now();
  })();
}

function pickLocalImg(kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ localImgs[kind]=r.result; autoShowImg(kind); toast('已选本地图（未入库）'); };
    r.readAsDataURL(f);
  };
  inp.click();
}
function clearLocalImg(kind){ delete localImgs[kind]; autoShowImg(kind); toast('已恢复自动匹配'); }

async function uploadImg(kind){
  if(!cur) return alert('请先选机型');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const fd=new FormData(); fd.append('file',f); fd.append('model',cur); fd.append('kind',kind);
    toast('上传中…');
    try{
      const r=await fetch(API_BASE+'api/upload-image',{method:'POST',body:fd});
      const j=await r.json();
      if(!j.ok) return alert(j.error||'上传失败');
      delete localImgs[kind];
      toast('已存入图片库：'+j.file); autoShowImg(kind);
    }catch(err){ alert('上传失败：'+err.message); }
  };
  inp.click();
}

/* ===== 上传 Datasheet 自动提取 ===== */
async function uploadDatasheet(){
  const inp=document.createElement('input'); inp.type='file';

/* 应用提取结果：兼容双频结构 {"50Hz":{..},"60Hz":{..},"common":{..}} 与旧扁平结构 */
function applyFields(fields){
  const m=findModel(cur); if(!m){ alert('先新建机型再上传'); return; }
  m.freqs = m.freqs || {};
  m.common = m.common || {};
  let n = 0;
  const isFreqObj = f => /^(50|60)Hz$/.test(f);
  const hasStruct = Object.keys(fields).some(isFreqObj) || ('common' in fields);
  if(hasStruct){
    Object.keys(fields).forEach(top=>{
      const v = fields[top];
      if(!v || typeof v!=='object') return;
      if(isFreqObj(top)){
        m.freqs[top] = Object.assign(m.freqs[top]||{}, v);
        n += Object.keys(v).length;
      } else if(top==='common'){
        Object.assign(m.common, v);
        n += Object.keys(v).length;
      }
    });
    // 自动切到提取到的第一个频率（优先有数据的）
    const got = Object.keys(m.freqs).filter(f=>Object.keys(m.freqs[f]).length);
    if(got.length) m.curFreq = got[0];
  } else {
    // 旧扁平：按频率字段拆分
    const fd = m.freqs[m.curFreq] = m.freqs[m.curFreq] || {};
    Object.keys(fields).forEach(k=>{
      if(k==='model'){ return; }
      if(FREQ_FIELDS.includes(k)) fd[k]=fields[k]; else m.common[k]=fields[k];
      n++;
    });
  }
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  renderForm();
  alert('✅ 已自动填入 '+n+' 个字段（频率：'+m.curFreq+'）\n请核对补全。');
  toast('已填入 '+n+' 个字段');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function save_soft(){ const m=findModel(cur); if(m) applyCollect(m, collect()); syncModelFromForm(); localStorage.setItem(LS_KEY,JSON.stringify(DB)); }

function newModel(){
  const n = (prompt('新机组型号（也是图片文件名）：')||'').trim();
  if(!n) return;
  if(findModel(n)) return alert('型号已存在');
  save_soft();
  DB.models.push({model:n, curFreq:'50Hz', freqs:{'50Hz':{}}, common:{model:n}});
  cur=n; localStorage.setItem(LS_KEY,JSON.stringify(DB)); renderForm(); toast('已新建 '+n);
}
function dupModel(){
  save_soft();
  const n = (prompt('复制为新型号名：', cur+'-COPY')||'').trim();
  if(!n) return;
  if(findModel(n)) return alert('型号已存在');
  const src=findModel(cur)||{};
  const c=JSON.parse(JSON.stringify(src)); c.model=n; c.common=c.common||{}; c.common.model=n;
  DB.models.push(c); cur=n; localStorage.setItem(LS_KEY,JSON.stringify(DB)); renderForm(); toast('已复制');
}
function delModel(){
  if(!confirm('确认删除机型 '+cur+' ？')) return;
  DB.models = DB.models.filter(x=>x.model!==cur);
  cur = DB.models.length? DB.models[0].model : null;
  localStorage.setItem(LS_KEY,JSON.stringify(DB)); renderForm(); toast('已删除');
}
function pickImg(){ autoShowImg('open'); autoShowImg('silent'); }
function exportJson(){
  save_soft();
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='paramsheet_data.json'; a.click(); toast('已导出');
}

/* ===== 导出 PPTX / PDF：调后端 /api/build ===== */
async function genFile(fmt){
  save_soft();
  const m = findModel(cur);
  if(!m){ return alert('请先新建机型（或检查「机组型号」是否为空）'); }
  const lang = document.getElementById('selLang').value || 'en';
  // 图片兜底检查：既没手选、型号又为空 -> 明确告知不会带图
  if(!localImgs.open && !localImgs.silent && !String(m.model||'').trim()){
    console.warn('[genFile] 无型号且未手选图片，将不带机组照片');
  }
  const fd = curFreqData(m);
  const meta = {};   // 标题旁型号字等元字段（存在 common 下）
  let data = Object.assign({}, m.common, fd, { model: m.model, freq_sel: m.curFreq });
  // 单位归一：数字 -> 完整字符串（kg / L / rpm / °C / DC24V / Class H/H）
  data = normalizeUnits(data);
  // 下拉选项按语言转换（模板为英文，中文环境出中文件时用中文）
  ['g_exc','g_conn','g_pitch','g_phase','g_brg'].forEach(k=>{
    if(data[k]) data[k] = optLabel(data[k], lang);
  });
  // 油耗：模板左列已有标签(100% ESP(L/H) 等)，右列只要纯数字，按同顺序拼多行
  const fcParts = [];
  if(fd.fc_esp || fd.fc_prp || fd.fc_75 || fd.fc_50){
    fcParts.push(fd.fc_esp||'', fd.fc_prp||'', fd.fc_75||'', fd.fc_50||'');
    data.fc_lines = fcParts;
  }
  // 本地手选图片随 payload 带（dataURL -> 后端写临时文件）
  // 图片：本地手选优先；没有则依赖后端按型号自动匹配 images/型号_OPEN.png
  if(localImgs.open) data.__img_open_data = localImgs.open;
  if(localImgs.silent) data.__img_silent_data = localImgs.silent;
  const hasOpen = !!localImgs.open, hasSilent = !!localImgs.silent;
  if(!hasOpen && !hasSilent){
    toast('未手选图片，将按型号自动匹配图片库…');
  }
  // 声压级符号框（模板 4 个格：开架/静音 @1m/@7m）；模板格已加了两行
  data.sound_db = [data.o_db1||'', data.o_db7||'', data.s_db1||'', data.s_db7||''];
  const payload = { lang: lang, format: fmt,
                    title_sub: (m.common&&m.common.__sub) || '',
                    title: (m.common&&m.common.title) || '',
                    freq: m.curFreq, data: data };
  toast(fmt==='pdf' ? '正在生成 PDF…' : '正在生成 PPTX…');
  try{
    const resp = await fetch(API_BASE+'api/build', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!resp.ok){
      let msg='生成失败';
      try{ const j=await resp.json(); msg=j.error||msg; }catch(e){}
      return alert(msg);
    }
    const blob = await resp.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(m.model||'paramsheet')+'_paramsheet_'+lang+'.'+fmt;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已生成并下载');
  }catch(e){
    alert('无法连接后端（请确认 server.py 已启动）：'+e.message);
  }
}
function importJson(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader();
    r.onload=()=>{ try{ DB=JSON.parse(r.result); cur=DB.models.length?DB.models[0].model:null;
      localStorage.setItem(LS_KEY,JSON.stringify(DB)); renderForm(); toast('已导入'); }catch(err){ alert('文件格式错误'); } };
    r.readAsText(f); };
  i.click();
}
let tt;
function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

renderForm();
</script>
