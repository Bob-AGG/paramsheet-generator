<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参数单生成器 · 数据管理</title>
<style>
  /* ===== 品牌红系 · 与「发电机选型工具」同一套（macOS 风格）===== */
  :root{
    /* 红 */
    --brand:#8e1f2c; --brand-2:#a8283a; --brand-hi:#c8323e; --brand-lite:#e04b4b;
    --brand-ink:#5b2028;
    --brand-soft:rgba(142,31,44,.08); --brand-soft2:rgba(142,31,44,.14);
    --brand-line:rgba(142,31,44,.10);
    /* 中性 */
    --ink:#1f2328; --ink-2:#4a5058; --ink-3:#6b7480; --ink-4:#98a1ac;
    --bg:#f2f1f3; --line:#e6e2e4; --line-2:#efecee;
    /* 表面 */
    --surf:#ffffff; --surf-2:#faf9fa; --surf-3:#f6f4f5;
    /* 兼容旧变量名（模板里大量使用） */
    --txt:var(--ink); --sub:var(--ink-3); --card:var(--surf);
    --pri:var(--brand-2); --pri-d:var(--brand);
    --ok:#16a34a; --warn:#e67e22; --danger:#dc2626;
    --grp:var(--surf-2);
    /* 曲线 */
    --ez-apple:cubic-bezier(.25,.1,.25,1);
    --ez-spring:cubic-bezier(.22,1,.36,1);
    --ez-expo:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* ===== 滚动条：与选型工具同一套暖红胶囊 ===== */
  html{overflow-y:scroll}
  *{scrollbar-width:thin;scrollbar-color:rgba(142,31,44,.30) transparent}
  *::-webkit-scrollbar{width:12px;height:12px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{
    background:rgba(142,31,44,.30);border-radius:99px;
    border:3px solid transparent;background-clip:content-box;min-height:32px;
  }
  *::-webkit-scrollbar-thumb:hover{background:rgba(142,31,44,.48);border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:active{background:rgba(142,31,44,.62);border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-corner{background:transparent}
  body{
    font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);padding:0 0 60px;
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 560px at 8% 4%,rgba(142,31,44,.055),transparent 64%),
      radial-gradient(760px 480px at 92% 10%,rgba(200,50,62,.045),transparent 62%),
      linear-gradient(160deg,#faf8f9 0%,#f3f1f3 52%,#eeecee 100%);
    background-attachment:fixed;
  }
  /* ===== 页头：不透明红渐变（不加 blur，滚动零额外开销）===== */
  header{
    background:linear-gradient(135deg,#e04b4b 0%,#c8323e 55%,#a8283a 100%);
    color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;
    position:sticky;top:0;z-index:50;flex-wrap:wrap;
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 16px rgba(142,31,44,.20);
  }
  header h1{font-size:17px;font-weight:700;margin-right:2px;letter-spacing:-.01em}
  header .spacer{flex:1}
  /* 页头里的按钮：半透明白玻璃 */
  header .btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.30);color:#fff}
  header .btn:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.46)}
  header .btn.pri{background:#fff;border-color:#fff;color:var(--brand);font-weight:700}
  header .btn.pri:hover{background:#fff5f5;color:var(--brand-2)}
  header .btn.pri2{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.42);color:#fff;font-weight:600}
  header .btn.pri2:hover{background:rgba(255,255,255,.32)}
  header .hdr-lang{color:rgba(255,255,255,.85);font-size:13px}
  header .hdr-lang select{
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);color:#fff;
    padding:6px 10px;border-radius:8px;font-size:13px;
  }
  header .hdr-lang select option{color:var(--ink);background:#fff}
  header .vsep{background:rgba(255,255,255,.30)}
  header .badge{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.34)}
  .btn{border:1px solid var(--line);background:var(--surf);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;
    color:var(--ink);transition:background .25s var(--ez-apple),border-color .25s var(--ez-apple),box-shadow .25s var(--ez-apple),transform .18s var(--ez-spring)}
  .btn:hover{border-color:#d6d0d2;background:var(--surf-3)}
  .btn:active{transform:scale(.985)}
  .btn.pri{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 2px 8px -2px rgba(142,31,44,.34)}
  .btn.pri:hover{filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.26) inset,0 4px 14px -2px rgba(142,31,44,.42)}
  .btn.danger{color:var(--danger);border-color:#fbc4c4}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:4px 10px;font-size:12px}
  /* 页头里的次要按钮（备份/维护，不与主流程抢视线） */
  header .btn.sub{background:transparent;border-color:rgba(255,255,255,.26);color:rgba(255,255,255,.86);font-size:12.5px;padding:6px 11px}
  header .btn.sub:hover{background:rgba(255,255,255,.16);color:#fff}
  /* 机型栏：分区 + 状态胶囊（2026-10-21 重排） */
  .bar.z1{align-items:flex-end;padding-bottom:4px}
  .bar.z2{padding-top:2px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .grp-lbl{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;display:block;margin-bottom:5px}
  .bar-col{display:flex;flex-direction:column;gap:0}
  .bar-row{display:flex;align-items:center;gap:8px}
  .dirty-pill{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:#a8620a;background:#fff7e8;border:1px solid #f5d9a8;border-radius:999px;padding:4px 11px}
  .dirty-pill.on{display:inline-flex}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--line);background:var(--surf)}
  .dirty-pill i{width:7px;height:7px;border-radius:50%;background:#e0952a;display:block;font-style:normal}
  .bar{display:flex;align-items:center;gap:10px;padding:16px 20px;flex-wrap:wrap;max-width:1200px;margin:0 auto;width:100%}
  .bar select,.bar input[type=text]{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--surf);min-width:220px;color:var(--ink);
    transition:border-color .25s var(--ez-apple),box-shadow .25s var(--ez-apple)}
  .bar select:focus,.bar input[type=text]:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft2)}
  /* 品牌/系列下拉（2026-10-23 用户需求：左侧品牌分类，右侧搜索框联动） */
  .fam-wrap{position:relative;display:inline-flex;align-items:center;gap:6px}
  .fam-wrap select{min-width:190px !important}
  .fam-count{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  /* 机型搜索结果下拉列表（2026-10-21） */
  .msearch-wrap{position:relative;display:inline-block}
  .msearch-list{position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:100%;min-width:360px;
    max-height:420px;overflow-y:auto;background:var(--surf);border:1px solid var(--line);
    border-radius:11px;box-shadow:0 12px 32px -8px rgba(31,35,40,.22);padding:4px;display:none}
  .msearch-list.on{display:block}
  .msearch-item{padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;display:flex;
    align-items:center;gap:8px;color:var(--ink)}
  .msearch-item:hover,.msearch-item.hi{background:var(--brand-soft2)}
  .msearch-item .mm{font-weight:600;white-space:nowrap}
  .msearch-item .ff{font-size:11px;color:var(--ink-3);background:#f2f3f5;border-radius:5px;padding:1px 6px;flex:0 0 auto}
  .msearch-item .vv{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:200px}
  .msearch-empty{padding:10px 12px;font-size:13px;color:var(--ink-3)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:16px;width:100%}
  .grp{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(31,35,40,.05),0 8px 24px -12px rgba(31,35,40,.10);
    transition:box-shadow .25s var(--ez-apple)}
  .grp>.hd{background:linear-gradient(180deg,#fdf3f3,#faf6f6);padding:12px 16px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;border-bottom:1px solid var(--brand-line);color:var(--brand-ink)}
  .grp>.hd .arw{font-size:11px;color:var(--sub);transition:.2s;display:inline-block}
  .grp.collapsed>.hd .arw{transform:rotate(-90deg)}
  .grp.collapsed>.bd{display:none}
  .grp>.hd .cnt{margin-left:auto;font-weight:400;color:var(--sub);font-size:12px}
  .bd{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px}
  .bd.one{grid-template-columns:1fr}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;color:var(--sub);font-weight:500}
  .fld input,.fld textarea{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--surf);width:100%;color:var(--ink);
    transition:border-color .25s var(--ez-apple),box-shadow .25s var(--ez-apple)}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft2)}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--ink-4)}
  .fld textarea{resize:vertical;min-height:64px;line-height:1.5}
  /* 单位固定：输入框右侧(或左侧)常显单位，用户只填数字 */
  .urow{display:flex;align-items:center;gap:6px}
  .urow input{flex:1;min-width:0}
  .upre{font-size:13px;color:var(--brand-ink);font-weight:700;white-space:nowrap}
  .usuf{font-size:13px;color:var(--brand-ink);font-weight:700;white-space:nowrap;min-width:18px}
  .fld select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--surf);width:100%;color:var(--ink);
    transition:border-color .25s var(--ez-apple),box-shadow .25s var(--ez-apple)}
  .fld select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft2)}
  .sub-h{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--brand-ink);margin-top:8px;padding-bottom:4px;border-bottom:1px dashed var(--brand-line)}
  .sub-h:first-child{margin-top:0}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-column:1/-1}
  .imgbox{display:flex;gap:16px;align-items:center;grid-column:1/-1}
  .imgbox .ph{width:150px;height:110px;border:2px dashed var(--brand-line);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);font-size:12px;background:var(--surf-2);overflow:hidden}
  .imgbox .ph img{width:100%;height:100%;object-fit:contain}
  .hint{font-size:12px;color:var(--sub);line-height:1.7}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(180deg,#a8283a,#8e1f2c);color:#fff;padding:11px 22px;border-radius:11px;font-size:13px;opacity:0;transition:.25s var(--ez-apple);pointer-events:none;z-index:99;
    box-shadow:0 6px 22px -6px rgba(142,31,44,.55)}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
  .empty{text-align:center;color:var(--sub);padding:50px 0}
  .badge{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);border:1px solid var(--brand-line);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700}
  .freqbar{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:13px;flex-wrap:wrap;
    box-shadow:0 1px 2px rgba(31,35,40,.05)}
  .fbtn{border:1px solid var(--line);background:var(--surf);padding:6px 18px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);
    transition:background .25s var(--ez-apple),border-color .25s var(--ez-apple),color .25s var(--ez-apple)}
  .fbtn:hover{border-color:var(--brand-line);color:var(--brand-ink);background:var(--surf-3)}
  .fbtn.on{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 2px 8px -2px rgba(142,31,44,.34)}
  /* ===== UI 优化 2026-10-19（2026-10-20 配色统一到品牌红系）===== */
  .vsep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .hdr-lang{display:flex;align-items:center;gap:6px}
  .btn.pri2{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink);font-weight:600}
  .btn.pri2:hover{background:var(--brand-soft2);border-color:rgba(142,31,44,.22)}
  .barlbl{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.02em}
  /* 进度条 */
  .prog{max-width:1200px;margin:0 auto 4px;padding:0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prog .pbar{flex:1;min-width:180px;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
  .prog .pbar i{display:block;height:100%;background:linear-gradient(90deg,#e04b4b,#8e1f2c);border-radius:5px;transition:width .3s var(--ez-apple)}
  .prog .pbar.full i{background:linear-gradient(90deg,#4ade80,#16a34a)}
  .prog .txt{font-size:12px;color:var(--sub);white-space:nowrap}
  .prog .txt b{color:var(--brand);font-size:13px}
  .prog .miss{font-size:11.5px;color:var(--warn);cursor:pointer;text-decoration:underline dotted}
  /* 分组头：序号徽标 + 页签提示 */
  .grp>.hd .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;font-size:11px;font-weight:700;
    box-shadow:0 1px 3px rgba(142,31,44,.30)}
  .grp>.hd .pg{margin-left:6px;font-size:11px;font-weight:500;color:var(--brand-ink);background:#fff;border:1px solid var(--brand-line);border-radius:5px;padding:0 7px}
  /* 子标题更轻 */
  .sub-h{display:flex;align-items:center;gap:6px}
  .sub-h::before{content:"";width:3px;height:12px;background:linear-gradient(180deg,var(--brand-hi),var(--brand));border-radius:2px}
  /* 必填提示 */
  .fld.req label::after{content:"*";color:var(--danger);margin-left:3px}
  /* 聚焦高亮分组 */
  .grp.flash{box-shadow:0 0 0 2px rgba(142,31,44,.35),0 8px 24px -12px rgba(142,31,44,.28)}
  @media (max-width:720px){
    header{gap:8px;padding:10px 12px}
    header h1{font-size:15px}
    .bar{padding:10px 12px;gap:8px}
    .bar select{min-width:140px}
    .wrap,.prog{padding:0 12px}
    .bd{grid-template-columns:1fr;padding:12px}
    .imgbox{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<header>
  <h1>参数单生成器</h1>
  <span class="badge">V2</span>
  <span class="spacer"></span>
  <label class="hint hdr-lang">语言
    <select id="selLang" style="min-width:auto;padding:6px 10px">
      <option value="en" selected>English</option>
      <option value="zh">中文</option>
    </select>
  </label>
  <span class="vsep"></span>
  <button class="btn sub" onclick="uploadDatasheet()" title="上传 PDF/图片，自动识别参数">📎 识别 Datasheet</button>
  <button class="btn sub" onclick="importJson()" title="导入机型 JSON 备份到库里">导入库</button>
  <button class="btn sub" onclick="exportJson()" title="把整个机型库导出成 JSON 备份">备份库</button>
  <span class="vsep"></span>
  <button class="btn pri2" onclick="save()" title="把当前修改写入机型库（会改动库）">💾 保存到库</button>
  <span class="vsep"></span>
  <button class="btn pri" onclick="genFile('pdf')" title="生成 PDF 参数单（不改动机型库）">⬇ 导出 PDF</button>
  <button class="btn pri2" onclick="genFile('pptx')" title="生成 PPTX 参数单（不改动机型库）">导出 PPTX</button>
</header>

<div class="bar z1">
  <span class="bar-col" style="width:100%">
    <span class="grp-lbl">选机型（找历史机型来导出，或作为新建的底稿）</span>
    <span class="bar-row" style="flex-wrap:wrap">
      <span class="fam-wrap">
        <select id="selFamily" onchange="onFamilyChange(this.value)" title="按品牌/系列筛选机型">
          <option value="">全部品牌</option>
        </select>
        <span class="fam-count" id="famCount"></span>
      </span>
      <span class="msearch-wrap">
        <input type="text" id="modelSearch" placeholder="🔍 搜机型 / 发动机 / 系列，如 CU1000" autocomplete="off"
               oninput="onModelSearch(this.value)" onfocus="onModelSearch(this.value)"
               onkeydown="modelSearchKey(event)" style="min-width:320px">
        <div class="msearch-list" id="msList"></div>
      </span>
      <span class="barlbl" id="searchHint" style="min-width:76px"></span>
      <select id="selModel" onchange="switchModel(this.value)" style="min-width:280px"></select>
      <button class="btn sm" onclick="newModel()" title="从空白开始建一个新机型（本地创建，点「保存到库」才入库）">+ 新建机型</button>
      <span class="spacer"></span>
      <span class="hint" id="status">正在连接服务器…</span>
    </span>
  </span>
</div>

<div class="bar z2">
  <span class="bar-col">
    <span class="grp-lbl">当前机型的动作</span>
    <span class="bar-row">
      <span class="dirty-pill" id="dirtyPill"><i></i>已修改，未存库</span>
      <button class="btn sm" id="btnRevert" onclick="revertModel()" title="丢弃本次修改，从库里重新读取原样" disabled>↺ 放弃修改</button>
      <button class="btn sm" onclick="saveAsNewModel()" title="把当前参数存成一个新机型，原机型不动（推荐用在「改了几个参数」的场景）">💾 存为新机型</button>
      <button class="btn sm danger" onclick="delModel()" title="从库里删除这个机型">删除此机型</button>
    </span>
  </span>
</div>

<!-- 填充进度：一眼看出还差哪些必填项 -->
<div class="prog" id="prog"></div>

<div class="wrap" id="form"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 字段定义（分组 = 模板模块） ================= */
/* 随频率变化的字段（放 freqs[频率]）；其余字段放 common */
const FREQ_FIELDS = ['freq','prp_kva','eps_kva','prp_kw','eps_kw',
                     'rpm','fc_esp','fc_prp','fc_75','fc_50'];

/* 只保留模板中标注了 12345 的格子；其余格子（含第3、4页）一律保持模板原值不动。
   分三类：机组 / 动力 / 电机 */
const GROUPS = [
 /* 顺序严格对应模板：第1页(功率→排量尺寸→声压级→动力概览) → 第2页(动力详参→电机) → 图片 */
 {id:'basic', t:'① 机组 · 第1页', open:true, fields:[
   {k:'model',  t:'机组型号（图片文件名）', ph:'例: D17'},
   {k:'__sub',  t:'标题旁型号字（留空=自动用机组型号）', ph:'留空即自动填入机组型号'},
   {k:'title',  t:'大标题（留空=自动）', ph:'Industrial Range Powered By X'},
   {sub:'功率 (Power)'},
   {k:'prp_kva',t:'PRP 功率', unit:'kVA'}, {k:'eps_kva',t:'EPS 功率', unit:'kVA'},
   {k:'prp_kw', t:'PRP 功率', unit:'kW'},  {k:'eps_kw', t:'EPS 功率', unit:'kW'},
   {k:'freq',   t:'频率 / 相数 / 功率因数', ph:'50Hz / 3P / PF0.8'},

/* API 基址：取当前页面所在目录（如 /paramsheet/），避免末尾无斜杠时相对路径解析错误 */
const API_BASE = (function(){
  let p = location.pathname;
  if(!p.endsWith('/')) p = p.substring(0, p.lastIndexOf('/')+1);
  return p;   // 形如 /paramsheet/
})();
const IMG_BASE = API_BASE;   // 图片库与接口同源

/* ================= 存储 =================
   机型结构（V2 双频）：
   { model, curFreq:'50Hz'|'60Hz', freqs:{ '50Hz':{随频率字段}, '60Hz':{...} }, common:{其余字段} }
   兼容旧结构：{ model, ...扁平字段 } -> 自动迁移到 freqs['50Hz'] + common */
const LS_KEY='paramsheet_db_v2';
/* 存储模式：
   server —— 机型库存服务器（SQLite），本地只做缓存 + 断线回退
   local  —— 服务器不可用，退回 localStorage
   用户 2026-10-20 定：数据存服务器，旧机型数据全部丢弃 */
let STORE_MODE = 'server';       // 'server' | 'local'
let SERVER_TOTAL = 0;
let DB = {models:[]};
let cur = null;

/* 页面立即渲染，数据异步加载（避免后端慢时白屏） */
function syncStatus(){
  const st=document.getElementById('status');
  if(!st) return;
  if(STORE_MODE==='server'){
    st.textContent = `共 ${DB.models.length} 个机型 · 数据存服务器`;
    st.style.color = '';
  }else{
    st.textContent = `⚠ 服务器未连接，暂存本地（${DB.models.length} 个机型）`;
    st.style.color = 'var(--warn)';
  }
}

/* 服务器可用性探测 */
async function apiAvailable(){
  try{
    const r = await fetch(API_BASE+'health', {cache:'no-store'});
    if(!r.ok) return false;
    const j = await r.json();
    return !!j.ok;
  }catch(e){ return false; }
}

/* 从服务器拉全部机型（含完整数据） */
async function loadFromServer(){
  const r = await fetch(API_BASE+'api/models-all', {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'加载失败');
  SERVER_TOTAL = j.total||0;
  return migrate({models: (j.models||[]).map(x=>({
    model: x.model || x.name,
    name:  x.name  || x.model,
    curFreq: x.curFreq || null,
    freqs: x.freqs || {},
    common: x.common || {},
    __family: x.family || '',
    __src: x.src || ''
  }))});
}

/* 旧 localStorage 数据：用户要求全部丢弃，这里只清理不复用 */
function purgeLocalOld(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  try{ localStorage.removeItem('paramsheet_db_v1'); }catch(e){}
}

/* 启动加载 */
async function boot(){
  renderForm();
  const okServer = await apiAvailable();
  if(okServer){
    try{
      DB = await loadFromServer();
      STORE_MODE = 'server';
      purgeLocalOld();          // 服务器连上 -> 丢掉浏览器旧数据
    }catch(e){
      console.warn('[boot] 服务器读取失败，回退本地', e);
      STORE_MODE = 'local';
      DB = {models:[]};
    }
  }else{
    STORE_MODE = 'local';
    DB = {models:[]};
  }
  cur = DB.models.length ? (DB.models[0].name || DB.models[0].model) : null;
  renderForm();
  syncStatus();
  if(STORE_MODE==='server'){
    toast(`已从服务器加载 ${DB.models.length} 个机型`);
  }else{
    toast('服务器未连接，数据暂存本地');
    console.info('[boot] local mode — 旧机型数据已按指示丢弃');
  }
}

/* 本地缓存（仅在 local 模式下使用；server 模式不回写，避免误导） */
function cacheLocal(){
  if(STORE_MODE!=='server'){ return; }
}
function migrate(db){
  if(!db||!db.models) return db;
  db.models.forEach(m=>{
    if(!m.freqs){
      const f={}, c={};
      Object.keys(m).forEach(k=>{
        if(k==='model'||k==='freqs'||k==='common'||k==='curFreq') return;
        if(FREQ_FIELDS.includes(k)) f[k]=m[k]; else c[k]=m[k];
      });
      m.freqs={}; m.freqs[m.curFreq||'50Hz']=f; m.common=c; m.curFreq=m.curFreq||'50Hz';
      Object.keys(m).forEach(k=>{ if(k!=='model'&&k!=='freqs'&&k!=='common'&&k!=='curFreq') delete m[k]; });
    }
    if(!m.common) m.common={};
    if(!m.curFreq) m.curFreq=Object.keys(m.freqs)[0]||'50Hz';
  });
  return db;
}
function curFreqData(m){
  m = m || findModel(cur);
  if(!m) return {};
  if(!m.freqs) return {};
  if(!m.freqs[m.curFreq]){
    // 当前频率没数据 -> 自动切到有的那个
    const avail=Object.keys(m.freqs);
    m.curFreq = avail[0] || '50Hz';
  }
  return m.freqs[m.curFreq] || {};
}
function availFreqs(m){ m=m||findModel(cur); return m && m.freqs ? Object.keys(m.freqs) : []; }

function save(){
  saveSoftToServer(cur);
}

/* 把某个机型推到服务器 */
async function pushModel(name){
  const m = findModel(name);
  if(!m) return false;
  if(STORE_MODE!=='server') return false;
  try{
    const r = await fetch(API_BASE+'api/models/save', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: m.name || m.model,
        model: m.model,
        family: m.__family || '',
        src: m.__src || '',
        overwrite: true,
        data: { model:m.model, curFreq:m.curFreq, freqs:m.freqs, common:m.common }
      })
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'保存失败');
    return true;
  }catch(e){
    console.warn('[pushModel]', e);
    STORE_MODE='local'; syncStatus();
    return false;
  }
}

/* 删除机型（服务器同步） */
async function deleteOnServer(name){
  if(STORE_MODE!=='server') return false;
  try{
    const r = await fetch(API_BASE+'api/models/'+encodeURIComponent(name), {method:'DELETE'});
    const j = await r.json();
    return !!j.ok;
  }catch(e){ return false; }
}
/* 查找机型：优先按唯一键 name 精确匹配，其次按 model（兼容老数据/图片匹配） */
function findModel(name){
  if(name==null) return undefined;
  return DB.models.find(x=>(x.name||x.model)===name)
      || DB.models.find(x=>x.model===name);
}

  const box = document.getElementById('msList');

/* 键盘：↑↓ 选择，Enter 确认，Esc 关闭 */
function modelSearchKey(e){
  const box = document.getElementById('msList');
  if(!box || !box.classList.contains('on')) return;
  const items = [...box.querySelectorAll('.msearch-item')];
  if(!items.length) return;
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    _msIdx = e.key==='ArrowDown' ? Math.min(_msIdx+1, items.length-1) : Math.max(_msIdx-1, 0);
    items.forEach((el,i)=>el.classList.toggle('hi', i===_msIdx));
    items[_msIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    e.preventDefault();
    const pick = items[_msIdx>=0?_msIdx:0];
    if(pick) pickModelFromSearch(pick.dataset.name);
  } else if(e.key==='Escape'){
    box.classList.remove('on'); _msIdx=-1;
  }
}

});

function _modelHaystack(x){
  const d = x.data || {};
  const cm = d.common || {};
  const freqs = d.freqs || {};
  const fvals = Object.values(freqs).flatMap(o=>Object.values(o||{}));
  return [
    x.name, x.model, x.family, cm.e_model, cm.e_brand,
    ...fvals.map(v=>String(v==null?'':v))
  ].filter(Boolean).join(' ').toUpperCase();
}

/* 按 _familyFilter + _modelQuery 过滤机型列表；关键词全命中才保留 */
function filteredModels(){
  let list = DB.models;
  if(_familyFilter){
    list = list.filter(x=> (x.family || '其他') === _familyFilter);
  }
  const qs = _modelQuery.toUpperCase().split(/\s+/).filter(Boolean);
  if(!qs.length) return list;
  return list.filter(x=>{
    const hay = _modelHaystack(x);
    return qs.every(q=>hay.includes(q));
  });
}

/* ================= 表单渲染 ================= */
function cleanVal(v){
  // 统一清洗：去首尾空白、多空格压成一个、去空行（保留换行使多行字段正常）
  return String(v==null?'':v)
    .split('\n').map(x=>x.replace(/[ \t\u00a0]+/g,' ').trim())
    .filter((x,i,arr)=> !(x==='' && (i===0||i===arr.length-1)) )   // 只去首尾空行
    .join('\n');
}
function collect(){
  const o={};
  document.querySelectorAll('[data-k]').forEach(el=>{ o[el.dataset.k]=cleanVal(el.value); });
  // 组合字段拼回：电池三段 / 充电发电机两段
  const g = k => String(o[k]||'').trim();
  const n=g('el_bat_n'), ah=g('el_bat_ah'), cca=g('el_bat_cca');
  if(n||ah||cca) o.el_bat = `${n||''}X${ah||''}Ah(${cca||''}CCA)`;
  delete o.el_bat_n; delete o.el_bat_ah; delete o.el_bat_cca;
  const av=g('el_alt_v'), aa=g('el_alt_a');
  if(av||aa) o.el_alt = `DC${av||''}V/${aa||''}A`;
  delete o.el_alt_v; delete o.el_alt_a;
  return o;
}

/* ===== 出件前归一：把"数字 + 固定单位"拼成模板要的完整字符串 =====
   只在导出时使用，不改用户填的原始数字，重复导出不会叠加单位。 */
function normalizeUnits(src){
  const d = Object.assign({}, src||{});
  const set = (k, unit, opt) => {
    let v = String(d[k]==null?'':d[k]).trim();
    if(!v) return;
    if(v.replace(/\s/g,'')==='TBA') return;                 // TBA 不补单位
    if(opt && opt.upper) v = v.toUpperCase();
    if(opt && opt.alreadyRe && opt.alreadyRe.test(v)) return; // 已带单位不重复补
    d[k] = v + (opt && opt.space ? ' ' : '') + unit;
  };
  // 后缀固定
  set('prp_kva','kVA',{space:true,alreadyRe:/kVA$/i});
  set('eps_kva','kVA',{space:true,alreadyRe:/kVA$/i});
  set('prp_kw','kW',{space:true,alreadyRe:/kW$/i});
  set('eps_kw','kW',{space:true,alreadyRe:/kW$/i});
  set('o_wt','kg',{space:true,upper:true,alreadyRe:/kg$/i});
  set('s_wt','kg',{space:true,upper:true,alreadyRe:/kg$/i});
  set('o_tank','L',{space:true,lower:true,alreadyRe:/L$/});
  set('s_tank','L',{space:true,lower:true,alreadyRe:/L$/});
  set('displ','L',{space:true,alreadyRe:/L$/});
  set('rpm','rpm',{space:true,alreadyRe:/rpm$/i});
  set('ex_t','°C',{space:true,alreadyRe:/(°C|℃)$/});
  set('in_t','°C',{space:true,alreadyRe:/(°C|℃)$/});
  set('co_oil','L',{space:true,alreadyRe:/L$/});
  set('co_cool','L',{space:true,alreadyRe:/L$/});
  // 前缀固定
  const pre = (k, prefix) => {
    let v = String(d[k]==null?'':d[k]).trim();
    if(!v) return;
    if(/^DC/i.test(v) || /^Class/i.test(v)) return;
    d[k] = prefix + v;
  };
  // 起动机电压：24 -> DC24V
  {
    let v = String(d.el_v==null?'':d.el_v).trim().toUpperCase().replace(/\s/g,'');
    if(v){ if(!/^DC/.test(v)) v='DC'+v; if(!/V$/.test(v)) v+='V'; d.el_v=v; }
  }
  // 绝缘/温升：Class H/[温升]（绝缘固定 H，只取温升段）
  {
    const r = insulRise(d.g_insul) || 'H';
    d.g_insul = 'Class H/' + r;
  }
  return d;
}

const OPT_ZH = {
  'Self-excited':'自励磁', 'PMG':'永磁(PMG)', 'Separately excited':'他励',
  'Star':'星形(Y)', 'Delta':'三角形(Δ)',
  'Two thirds':'2/3', 'Five sixths':'5/6',
  'Single phase':'单相', 'Three phase':'三相',
  'Single bearing':'单轴承', 'Double bearing':'双轴承'
};
function optLabel(v, lang){
  if(!v) return v;
  if(lang==='zh' && OPT_ZH[v]) return OPT_ZH[v];
  if(lang==='en'){   // 中文存量值反查英文
    for(const k in OPT_ZH){ if(OPT_ZH[k]===v) return k; }
  }
  return v;
}
/* 把表单值按频率/共用写回机型 */
function applyCollect(m, vals){
  if(!m) return;
  m.freqs = m.freqs || {};
  m.common = m.common || {};
  const fd = m.freqs[m.curFreq] = m.freqs[m.curFreq] || {};
  Object.keys(vals).forEach(k=>{
    if(k==='model'){ m.model = String(vals[k]||'').trim(); m.common.model = m.model; return; }
    if(k==='__sub'){ m.common.__sub = vals[k]; return; }   // 标题旁型号字：存 common
    if(k.startsWith('__')) return;              // __img_* 等元字段不进数据
    // 组合字段的中间键（电池三段 / 充电机两段）：不进数据，由 collect() 拼成 el_bat / el_alt
    if(['el_bat_n','el_bat_ah','el_bat_cca','el_alt_v','el_alt_a'].includes(k)) return;
    if(FREQ_FIELDS.includes(k)) fd[k]=vals[k]; else m.common[k]=vals[k];
  });
}
/* 型号唯一键：取 common.model 或旧 data.model；trim 防空格导致 findModel 失配 */
function curModelName(m){
  if(!m) return '';
  const v = (m.common && m.common.model) || m.model || '';
  return String(v).trim();
}
/* 从表单读「机组型号」输入框，实时同步给当前机型（关键修复） */
function syncModelFromForm(){
  const el = document.querySelector('[data-k="model"]');
  if(!el) return;
  const v = String(el.value||'').trim();
  const m = findModel(cur);
  if(!m) return;
  if(v && v!==m.model && !findModel(v)){
    m.model = v; m.common = m.common||{}; m.common.model = v;   // 改名（图片文件名也随 model 走）
    cur = v;
    fillModelSelect();
    fillFamilySelect();
  }
  renderListNames();
}
function renderListNames(){
  ['open','silent'].forEach(k=>{});
}
/* 切换频率：先把当前表单存回，再换频率渲染 */
function switchFreq(f){
  const m=findModel(cur); if(!m) return;
  applyCollect(m, collect());
  m.curFreq = f;
  pushModel(m.model);
  renderForm();
  toast('已切换到 '+f);
}
/* 添加频率（50Hz/60Hz 互斥，已有则不重复） */
function addFreq(){
  const m=findModel(cur); if(!m) return;
  m.freqs = m.freqs || {};
  const opts = ['50Hz','60Hz'].filter(f=>!m.freqs[f]);
  if(!opts.length) return alert('50Hz 和 60Hz 都有了');
  const f = opts.length===1 ? opts[0] : (prompt('添加频率（50Hz 或 60Hz）：', '60Hz')||'').trim();
  if(!f) return;
  if(!/^(50|60)Hz$/.test(f)) return alert('只能是 50Hz 或 60Hz');
  if(m.freqs[f]) return alert(f+' 已存在');
  applyCollect(m, collect());
  m.freqs[f] = {};
  m.curFreq = f;
  pushModel(m.model);
  renderForm();
  toast('已添加 '+f);
}

/* ===== 单位固定：显示层辅助 =====
   原则：输入框右侧（或左侧）单位常显，用户只填数字；
   出件前由 normalizeUnits() 统一拼回 "值+单位" 再交给后端。 */

/* 绝缘/温升：模板是 Class H/H（绝缘/温升）。绝缘固定 H，只让用户改温升段。 */
function insulRise(v){
  const t=String(v||'').trim();
  if(!t) return '';
  const m=t.match(/^\s*Class\s*[A-Z]\s*\/\s*([A-Z])\s*$/i);   // Class H/F
  if(m) return m[1].toUpperCase();
  if(/^[A-Z]$/i.test(t)) return t.toUpperCase();                  // 只填了 H
  return t;                                                       // 其它原样
}

function battHTML(v){
  // 兼容旧值：2x60Ah(720CCA) / 2x60Ah(580CCA)
  let n='',ah='',cca='';
  const m=String(v||'').replace(/\s/g,'').match(/^(\d+)[xX×](\d+)[Aa][Hh]?\(?(\d+)[Cc][Cc][Aa]?\)?$/);
  if(m){ n=m[1]; ah=m[2]; cca=m[3]; }
  else { const parts=String(v||'').split('/').map(x=>x.trim()); n=parts[0]||''; ah=parts[1]||''; cca=parts[2]||''; }
  return `<input type="text" data-k="el_bat_n" value="${esc(n)}" placeholder="2" style="flex:1">
    <span class="usuf">X</span>
    <input type="text" data-k="el_bat_ah" value="${esc(ah)}" placeholder="60" style="flex:1">
    <span class="usuf">Ah(</span>
    <input type="text" data-k="el_bat_cca" value="${esc(cca)}" placeholder="720" style="flex:1">
    <span class="usuf">CCA)</span>`;
}
function altPart(v, which){
  const m=String(v||'').replace(/^DC/i,'').replace(/\s/g,'').match(/^(\d+)[Vv]?[\/]?(\d*)/);
  if(!m) return '';
  return which==='v' ? m[1] : (m[2]||'');
}

function renderForm(){
  const m = findModel(cur) || {model:''};
  const fd = curFreqData(m);          // 当前频率数据
  const cm = m.common || {};          // 共用数据
  // __sub（标题旁型号字）留空时自动带出机组型号（2026-10-21 用户建议）
  const valOf = k => {
    if(k==='__sub') return (cm.__sub || '').trim() || (m.model || '');
    if(k==='model') return (m.model || '');
    return FREQ_FIELDS.includes(k) ? (fd[k]||'') : (cm[k]||'');
  };
  const el = document.getElementById('form');
  // 频率切换条
  const freqs = availFreqs(m);
  const freqBar = freqs.length ? `<div class="freqbar">频率：
      ${freqs.map(f=>`<button type="button" class="fbtn ${f===m.curFreq?'on':''}"
        onclick="switchFreq('${f}')">${esc(f)}</button>`).join('')}
      <span class="hint">切换频率数据（两套独立填写）</span>
      <button type="button" class="btn sm" style="margin-left:auto" onclick="addFreq()">+ 添加频率</button>
    </div>` : `<div class="freqbar"><span class="hint">无频率数据</span>
      <button type="button" class="btn sm" onclick="addFreq()">+ 添加频率</button></div>`;

  el.innerHTML = freqBar + GROUPS.map(g=>{
    const body = g.fields.map(f=>{
      if(f.sub) return `<div class="sub-h">${f.sub}</div>`;
      if(f.imgv) return `<div class="imgbox">
        <div class="ph" id="imgph-${f.imgv}"><span style="color:#b6bcc8">…</span></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="hint">${f.imgv==='open'
            ? '自动匹配：<code>'+esc(m.model||'型号')+'_OPEN.jpg</code>'
            : '静音图需手动选择'}<br>
            <span id="imgstat-${f.imgv}" style="color:var(--brand-2)"></span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sm" type="button" onclick="pickLocalImg('${f.imgv}')">选择本地图</button>
            <button class="btn sm" type="button" onclick="uploadImg('${f.imgv}')">上传到图片库</button>
            <button class="btn sm" type="button" onclick="clearLocalImg('${f.imgv}')">恢复自动匹配</button>
          </div></div></div>`;
      const v = esc(valOf(f.k));
      if(f.ta) return `<div class="fld" style="grid-column:1/-1"><label>${f.t}</label>
        <textarea data-k="${f.k}" placeholder="${f.ph||''}">${v}</textarea></div>`;
      const oninp = (f.k==='model') ? ' oninput="syncModelFromForm()"' : '';
      // 下拉框（固定选项，出件时按语言映射成英文/中文）
      if(f.opts){
        const cur0 = (valOf(f.k)||'').trim() || (f.defv||'');
        const opts = f.opts.map(o=>`<option value="${esc(o)}"${o===cur0?' selected':''}>${esc(o)}</option>`).join('');
        return `<div class="fld"><label>${f.t}</label>
          <select data-k="${f.k}" data-opts="1"><option value="">—</option>${opts}</select></div>`;
      }
      // 电池：个数 / 容量Ah / CCA 三段
      if(f.va==='batt') return `<div class="fld"><label>${f.t}</label>
        <div class="urow">${battHTML(v)}</div></div>`;
      // 绝缘/温升：Class H/[温升] —— 前段 Class H 固定，只改温升等级
      if(f.insulFixed){
        const cur1 = insulRise(valOf(f.k)) || 'H';
        return `<div class="fld"><label>${f.t}</label>
          <div class="urow"><span class="upre">Class ${esc(f.insulFixed)}/</span>
            <input type="text" data-k="${f.k}" value="${esc(cur1)}" placeholder="H" style="flex:1"></div></div>`;
      }
      // 带前缀单位（DCxxV / Class X/H）
      if(f.unit && f.unitPos==='pre'){
        if(f.amp){  // 充电发电机：DC[电压]V/[电流]A
          return `<div class="fld"><label>${f.t}</label>
            <div class="urow"><span class="upre">${esc(f.unit)}</span>
              <input type="text" data-k="${f.k}_v" value="${esc(altPart(v,'v'))}" placeholder="24" style="flex:1">
              <span class="usuf">V /</span>
              <input type="text" data-k="${f.k}_a" value="${esc(altPart(v,'a'))}" placeholder="40" style="flex:1">
              <span class="usuf">A</span></div></div>`;
        }
        const suf = f.tsuf ? `<span class="usuf">${esc(f.suffix||'')}</span>` : '';
        return `<div class="fld"><label>${f.t}</label>
          <div class="urow"><span class="upre">${esc(f.unit)}</span>
            <input type="text" data-k="${f.k}" value="${v}" placeholder="${f.ph||''}"${oninp}>${suf}</div></div>`;
      }
      // 后缀单位常显（kg / L / rpm / °C）
      if(f.unit) return `<div class="fld"><label>${f.t}</label>
        <div class="urow"><input type="text" data-k="${f.k}" value="${v}" placeholder="${f.ph||''}"${oninp}>
          <span class="usuf">${esc(f.unit)}</span></div></div>`;
      return `<div class="fld"><label>${f.t}</label>
        <input type="text" data-k="${f.k}" value="${v}" placeholder="${f.ph||''}"${oninp}></div>`;
    }).join('');
    const nFill = g.fields.filter(f=>!f.sub && !f.imgv && String(valOf(f.k)||'').trim()).length;
    const nAll  = g.fields.filter(f=>!f.sub && !f.imgv).length;
    const titleTxt = g.t.replace(/^[①②③④⑤]\s*/, '').replace(/\s*·\s*第\d页\s*$/, '');
    const num = (g.t.match(/^([①②③④⑤])/)||[])[1] || '';
    const pg  = (g.t.match(/·\s*(第\d页)/)||[])[1] || '';
    return `<div class="grp ${g.open?'':'collapsed'}" id="grp-${g.id}">
      <div class="hd" onclick="toggle('${g.id}')">
        <span class="arw">▼</span>
        ${num?`<span class="num">${num}</span>`:''}
        ${esc(titleTxt)}${pg?`<span class="pg">${pg}</span>`:''}
        <span class="cnt">${nFill}/${nAll} 已填</span>
      </div>
      <div class="bd">${body}</div></div>`;
  }).join('');
  // 型号下拉：显示 name（带区分标签），value 用 name 保证唯一
  fillModelSelect();
  fillFamilySelect();
  if(document.getElementById('status') && !document.getElementById('status').textContent.startsWith('●')) syncStatus();
  autoShowImg('open'); autoShowImg('silent');
  updateProgress();
  // 事件委托：任何字段变动 -> 刷新进度条 + 标记未保存（不重渲染表单，避免丢焦点）
  if(!el._bound){
    el._bound = true;
    el.addEventListener('input', onFieldChange);
    el.addEventListener('change', onFieldChange);
  }
}

/* ===== 四种使用路径（2026-10-21 用户定）=====
   路径1 选中机型 -> 直接导出           ：不动库
   路径2 选中机型 -> 改参数 -> 导出      ：不动库
   路径3 选中机型 -> 改参数 -> 导出 -> 存为新机型 ：库里新增一条
   路径4 新建机型 -> 改 -> 保存 -> 导出  ：保存时才入库
   核心：改字段只改内存（_edited），绝不自动写服务器。 */
let _edited = false;          // 当前机型是否有未保存的改动

function markEdited(on){
  _edited = !!on;
  const pill = document.getElementById('dirtyPill');
  if(pill) pill.classList.toggle('on', _edited);
  const btnR = document.getElementById('btnRevert');
  if(btnR) btnR.disabled = !_edited;
  const st = document.getElementById('status');
  if(!st) return;
  if(_edited){
    if(!st.dataset.orig) st.dataset.orig = st.textContent;
    st.textContent = '● 已修改（未保存，不影响库）';
    st.style.color = 'var(--warn)';
  }else if(st.dataset.orig){
    st.textContent = st.dataset.orig;
    st.style.color = '';
  }
}

/* 放弃修改：从服务器重新拉这个机型，覆盖本地内存（用户 2026-10-21 加） */
async function revertModel(){
  if(!_edited) return;
  if(!confirm('放弃对「' + cur + '」的本次修改，恢复成库里的原样？')) return;
  const name = cur;
  try{
    const r = await fetch(API_BASE + 'api/models/' + encodeURIComponent(name), {cache:'no-store'});
    const j = await r.json();
    const d = j && j.item && j.item.data;   // 接口返回 {ok, item:{...,data}} 
    if(!d) throw new Error('库里没有这个机型');
    const m = findModel(name);
    if(m){
      m.freqs = d.freqs || m.freqs;
      m.common = d.common || m.common;
      m.curFreq = d.curFreq || m.curFreq;
      m.model = d.model || m.model;
    }
    delete m.__unsaved;
    renderForm();
    markEdited(false);
    toast('已恢复为库里的原样');
  }catch(e){
    // 服务器拿不到 -> 退而重渲染当前内存（至少清掉表单未收集的输入）
    renderForm();
    markEdited(false);
    toast('服务器未连接，已回到上次加载的数据');
  }
}

function onFieldChange(){
  // 把表单写回内存（不写服务器），否则进度条读到的还是旧数据
  const m0 = findModel(cur);
  if(m0){ try{ applyCollect(m0, collect()); }catch(e){} }
  updateProgress();
  markEdited(true);
}

/* ===== 填充进度 =====
   v2（2026-10-21 修）：原来直接把「值是否为空」当缺失，导致两类误报：
     ① 表单显示有默认值（如绕组节距 Two thirds、相数 Three phase、轴承数 Single bearing），
        但库里没存 -> 看着是填好的却被算「缺」
     ② 组合字段没走正确的判断分支
   现在统一走 activeVal()：先读库里值，没有就用表单默认值，两边都算「已填」。 */
const KEY_REQUIRED = ['model','prp_kva','prp_kw','eps_kva','eps_kw','freq','std_v'];

/* 当前字段的「有效值」：库里值 > 表单默认值 defv */
function activeVal(f, fd, cm){
  const k = f.k;
  const raw = FREQ_FIELDS.includes(k) ? (fd[k]||'') : (cm[k]||'');
  if(String(raw).trim()) return String(raw).trim();
  if(f.defv) return String(f.defv);          // 表单渲染时就会显示这个值
  return '';
}

/* 组合字段：电池(个数/容量/CCA)、充电发电机(电压/电流)、绝缘温升 */
function comboRaw(f, cm){
  if(f.va==='batt') return [cm.el_bat_n, cm.el_bat_ah, cm.el_bat_cca].filter(Boolean).join('');
  if(f.amp)         return [cm.el_alt_v, cm.el_alt_a].filter(Boolean).join('');
  if(f.insulFixed)  return cm[f.k] || '';    // 前段 Class H 固定，后段温升
  return '';
}

function updateProgress(){
  const box = document.getElementById('prog');
  if(!box) return;
  const m = findModel(cur) || {};
  const fd = curFreqData(m), cm = m.common||{};
  let all=0, filled=0; const miss=[];
  GROUPS.forEach(g=>{
    if(g.id==='img') return;
    g.fields.forEach(f=>{
      if(f.sub||f.imgv) return;
      if(String(f.k).startsWith('__')) return;      // 图片/元字段不计入进度
      if(f.k==='title') return;                     // 大标题留空=自动生成，不算必填
      all++;
      let v;
      if(f.va || f.amp || f.insulFixed){
        v = comboRaw(f, cm) || activeVal(f, fd, cm);
      }else{
        v = activeVal(f, fd, cm);
      }
      if(String(v||'').trim()) filled++;
      else miss.push({k:f.k, t:f.t, gid:g.id});
    });
  });
  const pct = all? Math.round(filled*100/all) : 0;
  // 只列出前 5 个缺失项，点一下跳到对应分组
  let missHTML;
  if(miss.length){
    const names = miss.slice(0,4).map(x=>x.t).join('、') + (miss.length>4?' 等':'');
    missHTML = `<span class="miss" onclick="jumpTo('${miss[0].gid}')" title="${esc(miss.map(x=>x.t).join('\n'))}">缺 ${miss.length} 项（${esc(names)}）</span>`;
  }else{
    missHTML = `<span class="txt" style="color:var(--ok)">✓ 全部字段已填</span>`;
  }
  box.innerHTML = `<div class="pbar ${pct===100?'full':''}"><i style="width:${pct}%"></i></div>
    <span class="txt">已填 <b>${filled}</b>/${all} · ${pct}%</span>${missHTML}`;
}

/* 跳到某分组并高亮 */
function jumpTo(gid){
  const g=document.getElementById('grp-'+gid);
  if(!g) return;
  g.classList.remove('collapsed');
  g.scrollIntoView({behavior:'smooth', block:'center'});
  g.classList.add('flash');
  setTimeout(()=>g.classList.remove('flash'), 1400);
}

/* ===== 图片：自动匹配 / 手动选择 / 上传 =====
   优先级：本地手选(dataURL) > 图片库自动匹配 > 暂无
   本地手选仅存浏览器，导出时随 payload 带给后端 */
let localImgs = {};  // {open: dataURL, silent: dataURL}

function autoShowImg(kind){
  const p=document.getElementById('imgph-'+kind); if(!p) return;
  const st=document.getElementById('imgstat-'+kind); if(st) st.textContent='';
  // 本地手选优先
  if(localImgs[kind]){
    imgLevel[kind] = 'exact';
    p.innerHTML='';
    const im=new Image(); im.src=localImgs[kind]; im.style.maxWidth='100%'; im.style.maxHeight='100%';
    p.appendChild(im);
    if(st) st.textContent='（本地手选，未入库）';
    return;
  }
  // 静音图：不自动匹配图片库，一律手动选择（2026-10-21 用户定）
  if(kind==='silent'){
    p.innerHTML='<span style="color:#b6bcc8;text-align:center;line-height:1.6">静音图<br>'
      + '<span style="font-size:11px">请手动选择 / 上传</span></span>';
    if(st) st.textContent='静音图需手动选择';
    return;
  }
  // 图片文件名只用机组型号（去掉 " (400V开架) [发动机]" 之类的后缀）
  const model = modelKeyOf(cur);
  if(!model){ p.innerHTML='<span style="color:#b6bcc8">无型号</span>'; return; }
  p.innerHTML='<span style="color:#b6bcc8">…</span>';
  // 统一走后端 /api/images：后端有「精确 + 静态表 + 动态同动力索引」三层逻辑
  (async ()=>{
    let res = null;
    try{
      const r = await fetch(API_BASE+'api/images?model='+encodeURIComponent(model), {cache:'no-store'});
      if(r.ok) res = await r.json();
    }catch(e){ res = null; }

    if(res && res.ok){
      const fname = (res.images||{})[kind];
      const isBadge = !!(res.badge||{})[kind];
      const fb = res.fallback || {};
      if(fname){
        const url = IMG_BASE+'images/'+encodeURIComponent(fname);
        const img = new Image();
        img.onload = ()=>{
          if(isBadge){
            const lvl = fb.level==='platform' ? '同平台' : '同动力';
            showMatched(img, fname, fb.level || 'engine',
              lvl+'套用：'+(fb.src||'')+(fb.src_engine?(' ('+fb.src_engine+')'):''));
          }else{
            showMatched(img, fname, 'exact', '');
          }
        };
        img.onerror = ()=>notFound();
        img.src = url+'?t='+Date.now();
        return;
      }
      notFound();
      return;
    }

    // 后端不可用：退回本地兜底表
    const exts=['jpg','png'];
    (function tryOriginal(i){
      if(i<exts.length){
        const url=IMG_BASE+'images/'+encodeURIComponent(model)+'_'+kind.toUpperCase()+'.'+exts[i];
        const img=new Image();
        img.onload=()=>showMatched(img, model+'_'+kind.toUpperCase()+'.'+exts[i], 'exact', '');
        img.onerror=()=>tryOriginal(i+1);
        img.src=url+'?t='+Date.now();
        return;
      }
      (async ()=>{
        const fb = await loadFallback();
        const hit = fb && fb[model];
        if(!hit){ notFound(); return; }
        const url2 = IMG_BASE+'images/'+encodeURIComponent(hit.file);
        const img2 = new Image();
        img2.onload=()=>{
          const lvl = hit.level==='engine' ? '同动力' : '同平台';
          showMatched(img2, hit.file, hit.level,
            lvl+'套用：'+hit.src+(hit.src_engine?(' ('+hit.src_engine+')'):''));
        };
        img2.onerror=()=>notFound();
        img2.src=url2+'?t='+Date.now();
      })();
    })(0);
  })();

  function showMatched(img, fname, level, note){
    imgLevel[kind] = level;
    p.innerHTML='';
    img.style.maxWidth='100%'; img.style.maxHeight='100%';
    if(level!=='exact'){
      // 示意图角标
      const wrap=document.createElement('div');
      wrap.style.cssText='position:relative;display:inline-block;width:100%;height:100%;text-align:center';
      wrap.appendChild(img);
      const badge=document.createElement('span');
      badge.textContent='示意图';
      badge.style.cssText='position:absolute;right:6px;bottom:6px;background:rgba(255,152,0,.92);'
        + 'color:#fff;font-size:11px;padding:2px 7px;border-radius:4px;letter-spacing:.5px';
      wrap.appendChild(badge);
      p.appendChild(wrap);
    }else{
      p.appendChild(img);
    }
    if(st) st.textContent = level==='exact' ? ('已匹配 '+fname) : ('已匹配（'+note+'）');
  }

  function notFound(){
    imgLevel[kind] = '';
    p.innerHTML='暂无图片<br><span style="font-size:10px;color:#b6bcc8">'+esc(model)+'_'+kind.toUpperCase()+'</span>';
    if(st) st.textContent='未找到，可手动选择/上传';
  }
}

/* 机型名 -> 机组型号（图库文件名的键）
   "CU400E5 (400VG款) [QSG12-G3]"  ->  "CU400E5"   */
function modelKeyOf(name){
  const n = String(name==null?'':name).trim();
  if(!n) return '';
  const m = n.match(/^[A-Za-z0-9][A-Za-z0-9\/\.\-]*/);
  return m ? m[0].replace(/[\/]/g,'-') : '';
}

/* ===== 开架图兜底套用（2026-10-21 用户定 B 方案）=====
   规则：① 本型号有图直接用
        ② 同发动机型号 -> 套用（可复用）
        ③ 同发动机平台（KTA38-G1 ≈ KTA38-G2）-> 套用
   套用的图在预览里打「示意图」标记，导出时也带标记 */
let FALLBACK = null;          // 型号 -> {src, level, engine, src_engine, file}
let imgLevel = {};            // {open:'exact'|'engine'|'platform'|'', silent:''}  当前图来源
let FALLBACK_READY = false;

async function loadFallback(){
  if(FALLBACK_READY) return FALLBACK;
  try{
    const r = await fetch(IMG_BASE+'images_fallback.json', {cache:'no-cache'});
    if(r.ok) FALLBACK = await r.json();
  }catch(e){ FALLBACK = null; }
  FALLBACK_READY = true;
  return FALLBACK;
}

/* 本地导入图片 -> 立即入库（2026-10-21 用户定：底层逻辑改为导入即存库）
   流程：选文件 -> 上传 /api/upload-image -> 存成 型号_OPEN.jpg / 型号_SILENT.jpg
   失败才退回「本地临时图」模式（仅本次导出有效） */
function pickLocalImg(kind){
  if(!cur) return alert('请先选机型');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const model = modelKeyOf(cur);
    if(!model) return alert('当前机型无法确定机组型号，不能入库');

    // 先本地预览（让用户立刻看到图）
    const dataUrl = await new Promise(res=>{
      const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f);
    });
    localImgs[kind] = dataUrl;
    imgLevel[kind] = 'exact';
    autoShowImg(kind);
    toast('上传入库中…');

    // 上传入库
    try{
      const fd=new FormData();
      fd.append('file', f);
      fd.append('model', model);
      fd.append('kind', kind);
      const r = await fetch(API_BASE+'api/upload-image', {method:'POST', body:fd});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || '上传失败');

      delete localImgs[kind];          // 入库成功 -> 去掉本地临时图，改用库里的
      toast('已入库：'+j.file);
      autoShowImg(kind);
    }catch(err){
      // 入库失败：保留本地图（本次导出仍可用），但明确提示
      toast('入库失败，本次仅本地临时使用：'+err.message);
      const st=document.getElementById('imgstat-'+kind);
      if(st) st.textContent='⚠ 入库失败，仅本次导出有效';
    }
  };
  inp.click();
}
function clearLocalImg(kind){ delete localImgs[kind]; autoShowImg(kind); toast('已恢复自动匹配'); }

async function uploadImg(kind){
  if(!cur) return alert('请先选机型');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async e=>{

    toast('上传中…');
    try{

/* ===== 上传 Datasheet 自动提取 ===== */
async function uploadDatasheet(){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept='.pdf,.xlsx,.xls,.txt';
  inp.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const fd=new FormData(); fd.append('file',f); fd.append('model_hint', cur||'');
    toast('解析中…');
    try{
      const r=await fetch(API_BASE+'api/parse',{method:'POST',body:fd});
      const j=await r.json();
      console.log('[parse] 返回：', j);
      if(!j.ok) return alert(j.error||'解析失败');
      const fields=j.fields||{};
      const keys=Object.keys(fields);
      if(!keys.length) return alert('未提取到字段（可能是扫描件/格式不支持），请手动填写');
      applyFields(fields);
    }catch(err){ console.error('[parse] 失败：', err); alert('解析失败：'+err.message); }
  };
  inp.click();
}

/* 应用提取结果：兼容双频结构 {"50Hz":{..},"60Hz":{..},"common":{..}} 与旧扁平结构 */
function applyFields(fields){
  const m=findModel(cur); if(!m){ alert('先新建机型再上传'); return; }
  m.freqs = m.freqs || {};
  m.common = m.common || {};
  let n = 0;
  const isFreqObj = f => /^(50|60)Hz$/.test(f);
  const hasStruct = Object.keys(fields).some(isFreqObj) || ('common' in fields);
  if(hasStruct){
    Object.keys(fields).forEach(top=>{
      const v = fields[top];
      if(!v || typeof v!=='object') return;
      if(isFreqObj(top)){
        m.freqs[top] = Object.assign(m.freqs[top]||{}, v);
        n += Object.keys(v).length;
      } else if(top==='common'){
        Object.assign(m.common, v);
        n += Object.keys(v).length;
      }
    });
    // 自动切到提取到的第一个频率（优先有数据的）
    const got = Object.keys(m.freqs).filter(f=>Object.keys(m.freqs[f]).length);
    if(got.length) m.curFreq = got[0];
  } else {
    // 旧扁平：按频率字段拆分
    const fd = m.freqs[m.curFreq] = m.freqs[m.curFreq] || {};
    Object.keys(fields).forEach(k=>{
      if(k==='model'){ return; }
      if(FREQ_FIELDS.includes(k)) fd[k]=fields[k]; else m.common[k]=fields[k];
      n++;
    });
  }
  pushModel(m.model);
  renderForm();
  alert('✅ 已自动填入 '+n+' 个字段（频率：'+m.curFreq+'）\n请核对补全。');
  toast('已填入 '+n+' 个字段');
}
function toggle(id){ document.getElementById('grp-'+id).classList.toggle('collapsed'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderList(){ /* 占位：列表视图后续加 */ }

/* 下拉 value 是 name（可能带区分标签），cur 存 model —— 这里做一次映射 */
function switchModel(name){
  // 有未保存改动 -> 弹窗三选（用户 2026-10-21 定：必须问，不能自动丢）
  if(_edited && !_pendingSwitch){
    const m0 = findModel(cur);
    const from = cur;
    const c = confirmDiscardChanges(from, name);
    if(c === 'cancel'){ fillModelSelect(); return; }
    if(c === 'abort'){ fillModelSelect(); return; }
  }
  save_soft();
  _edited = false;
  const m = DB.models.find(x=>(x.name||x.model)===name) || DB.models.find(x=>x.model===name);
  cur = m ? (m.name || m.model) : name;
  renderForm();
  markEdited(false);
}

/* 有未保存改动时的三选弹窗。
   返回 'save'=存回原机型 / 'new'=存为新机型 / 'discard'=放弃 / 'cancel'=取消切换 */
let _pendingSwitch = false;
function confirmDiscardChanges(fromName, toName){
  const answer = window.confirm(
    '当前机型有未保存的修改：\n\n  ' + fromName + '\n\n' +
    '【确定】= 保存修改到原机型（会改动库）\n' +
    '【取消】= 放弃修改，切换到 ' + toName + '\n\n' +
    '（想保留改动又不覆盖原机型，请点「存为新机型」）'
  );
  if(answer){
    // 用户选保存到原机型
    saveSoftToServer(fromName);
    return 'save';
  }
  // 用户选放弃 -> 需要二次确认，避免误点丢数据
  return window.confirm('确定放弃「' + fromName + '」的修改？') ? 'discard' : 'cancel';
}

/* 明确保存到服务器（覆盖原机型） */
async function saveSoftToServer(name){
  save_soft();
  const ok = await pushModel(name);
  markEdited(false);
  toast(ok ? '已保存到库' : '服务器未连接，改动未入库');
  return ok;
}
/* 只把表单写回内存；不再自动推服务器（2026-10-21 改） */
function save_soft(){
  const m=findModel(cur);
  if(m) applyCollect(m, collect());
  syncModelFromForm();
}

/* 路径4：新建机型 —— 先只在本地建，点「保存」才真正入库（用户 2026-10-21 定）*/
function newModel(){
  if(_edited && !confirm('当前机型有未保存修改，新建会丢弃，继续？')) return;
  const n = (prompt('新机组型号（也是图片文件名）：')||'').trim();
  if(!n) return;
  if(findModel(n)) return alert('型号已存在');
  DB.models.push({model:n, name:n, curFreq:'50Hz', freqs:{'50Hz':{}}, common:{model:n}, __unsaved:true});
  cur=n; renderForm(); markEdited(true);
  toast('已新建 ' + n + '（本地未入库，点「保存」才写库）');
}

/* 路径3 的入口：把当前机型的当前参数另存为新机型 */
function saveAsNewModel(){
  save_soft();
  const src = findModel(cur);
  if(!src) return alert('请先选一个机型');
  const def = cur + '-1';
  const n = (prompt('存为新机型，新型号名：', def)||'').trim();
  if(!n) return;
  if(findModel(n)) return alert('型号已存在，换个名字');
  const c = JSON.parse(JSON.stringify(src));
  c.model = n; c.name = n;
  c.common = c.common || {}; c.common.model = n;
  delete c.__unsaved;
  DB.models.push(c);
  cur = n; renderForm(); markEdited(false);
  pushModel(n).then(ok=>{
    toast(ok ? '已存为新机型：' + n : '服务器未连接，仅存本地');
  });
}

async function delModel(){
  if(!confirm('确认删除机型 '+cur+' ？此操作会同时从服务器删除。')) return;
  const gone = cur;
  const m0 = findModel(gone);
  DB.models = DB.models.filter(x=>(x.name||x.model)!==gone && x.model!==gone);
  cur = DB.models.length? (DB.models[0].name||DB.models[0].model) : null;
  renderForm();
  if(m0) await deleteOnServer(m0.name || m0.model);
  toast('已删除 '+gone);
}
function pickImg(){ autoShowImg('open'); autoShowImg('silent'); }
function exportJson(){
  save_soft();
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='paramsheet_data.json'; a.click(); toast('已导出');
}

/* ===== 导出 PPTX / PDF：调后端 /api/build ===== */
async function genFile(fmt){
  save_soft();
  const m = findModel(cur);
  if(!m){ return alert('请先新建机型（或检查「机组型号」是否为空）'); }
  const lang = document.getElementById('selLang').value || 'en';
  // 图片兜底检查：既没手选、型号又为空 -> 明确告知不会带图
  if(!localImgs.open && !localImgs.silent && !String(m.model||'').trim()){
    console.warn('[genFile] 无型号且未手选图片，将不带机组照片');
  }
  const fd = curFreqData(m);
  const meta = {};   // 标题旁型号字等元字段（存在 common 下）
  let data = Object.assign({}, m.common, fd, { model: m.model, freq_sel: m.curFreq });
  // 单位归一：数字 -> 完整字符串（kg / L / rpm / °C / DC24V / Class H/H）
  data = normalizeUnits(data);
  // 下拉选项按语言转换（模板为英文，中文环境出中文件时用中文）
  ['g_exc','g_conn','g_pitch','g_phase','g_brg'].forEach(k=>{
    if(data[k]) data[k] = optLabel(data[k], lang);
  });
  // 油耗：模板左列已有标签(100% ESP(L/H) 等)，右列只要纯数字，按同顺序拼多行
  const fcParts = [];
  if(fd.fc_esp || fd.fc_prp || fd.fc_75 || fd.fc_50){
    fcParts.push(fd.fc_esp||'', fd.fc_prp||'', fd.fc_75||'', fd.fc_50||'');
    data.fc_lines = fcParts;
  }
  // 本地手选图片随 payload 带（dataURL -> 后端写临时文件）
  // 图片：本地手选优先；没有则依赖后端按型号自动匹配 images/型号_OPEN.png
  if(localImgs.open) data.__img_open_data = localImgs.open;
  if(localImgs.silent) data.__img_silent_data = localImgs.silent;
  const hasOpen = !!localImgs.open, hasSilent = !!localImgs.silent;
  if(!hasOpen && !hasSilent){
    toast('未手选图片，将按型号自动匹配图片库…');
  }
  // 声压级符号框（模板 4 个格：开架/静音 @1m/@7m）；模板格已加了两行
  data.sound_db = [data.o_db1||'', data.o_db7||'', data.s_db1||'', data.s_db7||''];
  // 标题旁型号字：库里没填就自动用机组型号（2026-10-21 改）
  const subAuto = String((m.common&&m.common.__sub) || '').trim() || String(m.model || '').trim();
  // 示意图标记：套用来的图（同动力/同平台）在 PPT 上打标
  data.__img_badge__ = {
    open: imgLevel.open === 'engine' || imgLevel.open === 'platform',
    silent: imgLevel.silent === 'engine' || imgLevel.silent === 'platform'
  };
  const payload = { lang: lang, format: fmt,
                    title_sub: subAuto,
                    title: (m.common&&m.common.title) || '',
                    freq: m.curFreq, data: data };
  toast(fmt==='pdf' ? '正在生成 PDF…' : '正在生成 PPTX…');
  try{
    const resp = await fetch(API_BASE+'api/build', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!resp.ok){
      let msg='生成失败';
      try{ const j=await resp.json(); msg=j.error||msg; }catch(e){}
      return alert(msg);
    }
    const blob = await resp.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(m.model||'paramsheet')+'_paramsheet_'+lang+'.'+fmt;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已生成并下载');
  }catch(e){
    alert('无法连接后端（请确认 server.py 已启动）：'+e.message);
  }
}
/* 导入 JSON -> 批量推到服务器（不再覆盖本地 localStorage） */
function importJson(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=async()=>{
      let payload;
      try{ payload=JSON.parse(r.result); }catch(err){ return alert('文件格式错误'); }
      const src = Array.isArray(payload) ? payload : (payload.models||[]);
      if(!src.length) return alert('文件里没有机型数据');
      await importItems(src);
    };
    r.readAsText(f); };
  i.click();
}

/* 批量导入入口：既给「导入 JSON」用，也给「从转换结果导入」用 */
async function importItems(items){
  if(STORE_MODE!=='server') return alert('服务器未连接，无法导入（请确认后端已启动）');
  const body = items.map(x=>{
    const m = x.data ? x : {
      model: x.model, curFreq: x.curFreq ||
        (x.freqs ? Object.keys(x.freqs)[0] : '50Hz'),
      freqs: x.freqs, common: x.common
    };
    return {
      name: x.name || m.model,
      model: m.model,
      family: x.family || '',
      src: x.src || '',
      data: { model:m.model, curFreq:m.curFreq, freqs:m.freqs, common:m.common }
    };
  });
  toast('正在导入 '+body.length+' 个机型…');
  try{
    const r = await fetch(API_BASE+'api/models/import', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({overwrite:true, items:body})
    });
    const j = await r.json();
    if(!j.ok) return alert(j.error||'导入失败');
    DB = await loadFromServer();
    cur = DB.models.length ? (DB.models[0].name || DB.models[0].model) : null;
    renderForm(); syncStatus();
    toast(`导入完成：新增 ${j.added}，更新 ${j.updated}，跳过 ${j.skipped}`);
  }catch(err){
    alert('导入失败：'+err.message);
  }
}
let tt;
function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

boot();
