<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机组参数单管理工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef1f5;color:#1f2328;font-size:13px}
.top{background:#1f4e79;color:#fff;height:52px;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:100}
.top h1{font-size:15px;font-weight:600}
.top .sp{flex:1}
.top .st{font-size:12px;opacity:.8}
/* 顶栏语言下拉：深蓝底上必须显式配色，否则看不见 */
.top select{background:#fff;color:#1f4e79;border:1px solid rgba(255,255,255,.5);
  border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;outline:none}
.top select:hover{background:#e6eef7}
.btn{border:none;padding:7px 15px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:#1f4e79}
.btn:hover{background:#e6eef7}
.btn.primary{background:#1f6feb;color:#fff}
.btn.primary:hover{background:#1a5fd0}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 顶部搜索条 */
.sbar{background:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #dfe4ea;flex-wrap:wrap}
.sbar input[type=text]{flex:1;min-width:200px;padding:8px 12px;border:1px solid #d3d9e0;border-radius:6px;font-size:13px;outline:none}
.sbar input[type=text]:focus{border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,.1)}
.sbar select{padding:8px 10px;border:1px solid #d3d9e0;border-radius:6px;font-size:12.5px;background:#fff;min-width:120px}
.sbar .modebtn{padding:8px 18px;border:2px solid #dfe4ea;background:#fff;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:#4b5563}
.sbar .modebtn.on{border-color:#1f6feb;background:#eef5ff;color:#1f6feb}

/* 主体：左列表 + 中编辑 + 右预览 */
.body{display:grid;grid-template-columns:270px 400px 1fr;gap:10px;padding:10px;height:calc(100vh - 108px)}
@media(max-width:1500px){.body{grid-template-columns:240px 370px 1fr}}
@media(max-width:1200px){.body{grid-template-columns:1fr;height:auto}}

.col{background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.col-h{padding:10px 14px;border-bottom:1px solid #eef1f4;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;flex:0 0 auto;background:#fafbfc}
.col-h .n{color:#6b7280;font-weight:400;font-size:11.5px}
.col-b{flex:1;overflow-y:auto;min-height:0}

/* 列表 */
.item{padding:9px 14px;border-bottom:1px solid #f3f5f7;cursor:pointer}
.item:hover{background:#f8fafc}
.item.on{background:#eef5ff;border-left:3px solid #1f6feb;padding-left:11px}
.item .t{font-size:12.5px;font-weight:500;line-height:1.35;word-break:break-all}
.item .m{font-size:11px;color:#78828e;margin-top:3px}
.pager{padding:8px;border-top:1px solid #eef1f4;display:flex;gap:6px;justify-content:center;align-items:center;font-size:11.5px;flex:0 0 auto}
.pager button{padding:4px 10px;border:1px solid #d3d9e0;background:#fff;border-radius:4px;cursor:pointer;font-size:11.5px}
.pager button:disabled{opacity:.4}

/* 编辑区 */
.grp{border-bottom:1px solid #f0f2f5}
.grp-t{padding:9px 14px;font-size:12px;font-weight:600;color:#1f4e79;background:#f6f9fc;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.grp-t .ar{font-size:9px;color:#8b95a1}
.grp-b{padding:8px 14px 12px}
.fld{display:flex;align-items:center;margin-bottom:7px;gap:8px}
.fld label{width:118px;flex:0 0 118px;font-size:12px;color:#5b6572;line-height:1.3}
.fld input,.fld select{flex:1;min-width:0;padding:5px 8px;border:1px solid #dbe0e6;border-radius:5px;font-size:12.5px;outline:none;background:#fff}
.fld input:focus,.fld select:focus{border-color:#1f6feb;box-shadow:0 0 0 2px rgba(31,111,235,.12)}
.fld input.chg{border-color:#e6a23c;background:#fffdf5}
/* 非标单一律橙框（区别于「改过但还没保存」的 chg） */
.fld input.nstd{border-color:#e6a23c;background:#fffdf5}
.nstdbar{margin:0 12px 8px;padding:8px 10px;border:1px solid #f0c989;background:#fffbf2;
  border-radius:6px;font-size:12px;line-height:1.65;color:#8a5a00;max-height:150px;overflow:auto}
.nstdbar .nb-t{font-weight:700;color:#b45309}
.nstdbar .nb-i{display:inline-block;margin:2px 10px 0 0;padding:1px 6px;background:#fff3dd;
  border:1px solid #f0c989;border-radius:4px;color:#8a5a00}
.nstdbar .nb-i b{color:#b45309}
.nstdbar .nb-w{color:#b91c1c;font-weight:700}
.tba{color:#b0b7c0;font-style:italic}

/* 开架静音切换 */
.shellbar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #eef1f4;background:#fafbfc}
.sb{flex:1;border:2px solid #dfe4ea;border-radius:8px;background:#fff;padding:9px 10px;cursor:pointer;text-align:left;position:relative}
.sb:hover{border-color:#b9c6d4}
.sb.on{border-color:#1f6feb;background:#eef5ff}
.sb .t{font-size:13px;font-weight:600}
.sb .d{font-size:10.5px;color:#78828e;margin-top:2px}
.sb .bd{position:absolute;top:7px;right:8px;font-size:9.5px;padding:1px 5px;border-radius:3px}
.bd.ok{background:#dcfce7;color:#15803d}
.bd.no{background:#f1f3f5;color:#8b95a1}

/* 预览区 */
.pv{background:#fff;padding:0}
.pv-bar{padding:10px 16px;border-bottom:1px solid #eef1f4;display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fafbfc;position:sticky;top:0;z-index:5}
.pv-bar .hint{font-size:11px;color:#9aa4b0;margin-left:auto}
.paper{background:#fff;max-width:900px;margin:16px auto;padding:0;box-shadow:0 2px 14px rgba(0,0,0,.09);border-radius:3px;font-size:12.5px;overflow:hidden}
/* === 真模板预览 === */
.pv-live{background:#eef1f4;min-height:300px;padding:14px 0}
.pv-wait{text-align:center;padding:60px 20px;color:#9aa4b0;font-size:13px}
.pv-page{max-width:880px;margin:0 auto 16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14);border-radius:2px;overflow:hidden;position:relative}
.pv-page .pv-no{position:absolute;top:6px;left:8px;background:rgba(31,78,121,.85);color:#fff;font-size:10px;padding:2px 7px;border-radius:3px;z-index:2}
.pv-page img{width:100%;display:block}

/* PDF 遮罩 */
.mask{position:fixed;inset:0;background:rgba(20,26,33,.55);z-index:200;display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
.mbox{background:#fff;border-radius:11px;padding:26px 34px;text-align:center;font-size:14px;min-width:250px}
.spin{width:30px;height:30px;border:3px solid #e4e8ec;border-top-color:#1f6feb;border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;top:64px;right:20px;background:#1f2328;color:#fff;padding:10px 16px;border-radius:7px;font-size:12.5px;z-index:999;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{padding:50px 20px;text-align:center;color:#9aa4b0;font-size:13px}
</style>
</head>
<body>

<div class="top">
  <h1>机组参数单管理</h1>
  <span class="st" id="verinfo"></span>
  <div class="sp"></div>
  <select id="fLang" onchange="setLang(this.value)" title="参数单语言">
    <option value="zh">中文版</option>
    <option value="en">English</option>
  </select>
  <span class="st" id="who">游客模式</span>
  <button class="btn ghost" id="loginBtn" onclick="doLogin()">管理员登录</button>
</div>

<div class="sbar">
  <button class="modebtn on" data-kind="std" onclick="setKind('std')">标准参数单</button>
  <button class="modebtn" data-kind="nonstd" onclick="setKind('nonstd')">非标参数单</button>
  <select id="fFamily" onchange="doSearch()"><option value="">全部动力品牌</option></select>
  <select id="fShell" onchange="doSearch()"><option value="">全部款式</option></select>
  <input type="text" id="fKw" placeholder="搜型号 / 发动机 / 品牌 / 电压" onkeydown="if(event.key==='Enter')doSearch()">
  <button class="btn primary" onclick="doSearch()">搜索</button>
  <button class="btn" id="newBtn" onclick="doNew()" style="margin-left:auto">+ 新增参数单</button>
  <button class="btn" id="deriveBtn" onclick="doDerive()" style="display:none">＋ 由标准单派生非标</button>
</div>

<div class="body">
  <!-- 左：列表 -->
  <div class="col">
    <div class="col-h">参数单列表 <span class="n" id="listCnt"></span></div>
    <div class="col-b" id="list"><div class="empty">加载中…</div></div>
    <div class="pager" id="pager"></div>
  </div>

  <!-- 中：编辑 -->
  <div class="col">
    <div class="col-h">参数编辑 <span class="n" id="editName"></span>
      <span id="editOps" style="margin-left:auto;display:none;gap:6px">
        <button class="btn primary" style="padding:4px 12px;font-size:12px" onclick="doSave()">保存</button>
        <button class="btn" style="padding:4px 10px;font-size:12px;color:#b91c1c" onclick="doDelete()">删除</button>
      </span></div>
    <div id="shellbar"></div>
    <div id="nstdbar" class="nstdbar" style="display:none"></div>
    <div class="col-b" id="editor"><div class="empty">左边选一个参数单</div></div>
  </div>

  <!-- 右：实时预览 -->
  <div class="col">
    <div class="col-b pv" id="preview">
      <div class="empty">预览区<br><span style="font-size:12px">编辑参数时这里实时刷新</span></div>
    </div>
  </div>
</div>

<div class="mask" id="mask"><div class="mbox"><div class="spin"></div><div id="maskTxt">正在生成 PDF…</div></div></div>
<div class="toast" id="toast"></div>

<script>
const S={kind:'std',page:1,size:20,q:'',family:'',shell:'',cur:null,data:null,orig:null,
         shells:new Set(),dict:null,admin:false,diff:null,isNew:false,lang:'zh'};

const $=id=>document.getElementById(id);

/* ---------- 语言切换 ---------- */
function setLang(v){
  S.lang = (v==='en') ? 'en' : 'zh';
  try{ localStorage.setItem('ps_lang', S.lang); }catch(e){}
  const sel=$('fLang'); if(sel) sel.value=S.lang;
  if(S.data) renderPreview(true);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000);}
const T=(v)=> (v==null||v==='') ? '<span class="tba">TBA</span>' : esc(v);

/* 字段分组定义：编辑表单结构（跟着 PPT 模板走） */
const GROUPS=[
 {t:'额定输出',open:true,f:[
   ['prp_kva','主用功率 kVA'],['prp_kw','主用功率 kW'],
   ['eps_kva','备用功率 kVA'],['eps_kw','备用功率 kW'],
   ['std_v','标准电压'],['opt_v','可用电压'],
 ]},
 {t:'常规参数（随开架/静音切换）',open:true,shellAware:true,f:[
   ['lwh','外形尺寸 L×W×H (mm)'],['wt','净重 (kg)'],['tank','油箱容量 (L)'],
 ]},
 {t:'机组基础',open:true,f:[
   ['cur_freq','频率'],['rpm','转速'],['model','机组型号'],
 ]},
 {t:'发动机',open:false,f:[
   ['e_brand','发动机品牌'],['e_model','发动机型号'],['e_fuel','燃料类型'],
   ['e_asp','进气方式'],['e_cool','冷却方式'],['e_gov','调速方式'],['e_cyl','缸数/排量'],
   ['displ','排量 (L)'],['cyl_arr','缸数排列'],['bore','缸径×冲程'],
 ]},
 {t:'排气系统',open:false,f:[['ex_t','排气温度 (℃)'],['ex_f','排气流量'],['ex_bp','最大排气背压']]},
 {t:'燃油系统',open:false,f:[['fu_res','进油口阻力'],['fu_max','最大燃油流量']]},
 {t:'冷却系统',open:false,f:[['co_air','散热器风扇风量'],['co_oil','机油容量 (L)'],['co_cool','冷却液容量 (L)']]},
 {t:'电气系统',open:false,f:[['el_v','启动电压'],['el_bat','启动电池'],['el_alt','充电发电机']]},
 {t:'进气系统',open:false,f:[['in_flt','空滤类型'],['in_res','进气阻力'],['in_flow','进气流量'],['in_t','进气温度 (℃)']]},
 {t:'发电机',open:false,f:[
   ['g_insul','绝缘/温升'],['g_exc','励磁方式'],['g_lead','引出线数'],
   ['g_conn','绕组接法'],['g_pitch','节距'],['g_phase','相数'],['g_brg','轴承'],
 ]},
];

/* ---------- 字典 ---------- */
async function loadDict(){
  const d=await (await fetch(`api/dict?kind=${S.kind}`)).json();
  S.dict=d;
  $('fFamily').innerHTML='<option value="">全部动力品牌</option>'+
    d.family.filter(f=>f.count>0).map(f=>`<option value="${f.code}">${esc(f.name)} · ${f.count}</option>`).join('');
  $('fShell').innerHTML='<option value="">全部款式</option>'+
    d.shell.filter(s=>s.count>0).map(s=>`<option value="${s.code}">${esc(s.name)} · ${s.count}</option>`).join('');
  $('verinfo').textContent=`共 ${d.total} 条`+(S.kind==='std'?`（待分类 ${d.pending}）`:'');
}
function setKind(k){
  S.kind=k;S.page=1;S.cur=null;S.data=null;
  document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('on',b.dataset.kind===k));
  $('editor').innerHTML='<div class="empty">左边选一个参数单</div>';
  $('shellbar').innerHTML='';
  $('preview').innerHTML='<div class="empty">预览区</div>';
  $('editName').textContent='';
  $('editOps').style.display='none';
  $('newBtn').style.display = k==='std' ? '' : 'none';
  $('deriveBtn').style.display = k==='nonstd' ? '' : 'none';
  loadDict().then(()=>doSearch());
}

/* ---------- 列表 ---------- */
async function doSearch(page){
  S.page=page||1;
  S.q=$('fKw').value.trim();S.family=$('fFamily').value;S.shell=$('fShell').value;
  const p=new URLSearchParams({kind:S.kind,q:S.q,family:S.family,shell:S.shell,page:S.page,size:S.size});
  const d=await (await fetch('api/list?'+p)).json();
  $('listCnt').textContent=`${d.total} 条`;
  $('list').innerHTML=d.items.map(it=>`
    <div class="item ${S.cur===it.name?'on':''}" onclick='openDetail(${JSON.stringify(it.name)})'>
      <div class="t">${esc(it.name)}</div>
      <div class="m">${esc(it.shell_name||'—')} · ${esc(it.family_name||'')}${it.p50?' · '+it.p50+'kVA':''}${it.zone==='pending'?' · 待分类':''}</div>
    </div>`).join('')||'<div class="empty">没有匹配</div>';
  $('pager').innerHTML=d.pages>1?`
    <button ${d.page<=1?'disabled':''} onclick="doSearch(${d.page-1})">上一页</button>
    <span>${d.page}/${d.pages}</span>
    <button ${d.page>=d.pages?'disabled':''} onclick="doSearch(${d.page+1})">下一页</button>`:'';
}

/* ---------- 打开详情 ---------- */
async function openDetail(name){
  S.isNew=false;S.cur=name;S.shells=new Set();
  const p=new URLSearchParams({kind:S.kind,name});
  const r=await (await fetch('api/detail?'+p)).json();
  if(!r.ok){toast('读取失败');return;}
  S.data=JSON.parse(JSON.stringify(r.data));   // 编辑副本
  S.orig=JSON.parse(JSON.stringify(r.data));   // 原始值（用来标改动）
  S.diff=r.diff;
  if(S.data.has_open)S.shells.add('OPEN');
  else if(S.data.has_silent)S.shells.add('SILENT');
  $('editName').textContent=S.data.parsed.model_code||'';
  renderShellbar();renderNonstdBar();renderEditor();renderPreview();
  $('editOps').style.display='flex';
  document.querySelectorAll('.item').forEach(el=>{
    el.classList.toggle('on',el.querySelector('.t').textContent===name);
  });
}

/* ---------- 开架/静音 ---------- */
function renderShellbar(){
  const d=S.data;
  $('shellbar').innerHTML=`<div class="shellbar" style="border:none;padding:10px 14px;display:flex;gap:8px">
    <button class="sb ${S.shells.has('OPEN')?'on':''}" onclick="toggleShell('OPEN')">
      <div class="t">开架</div><div class="d">${esc(d.o_lwh||'尺寸 TBA')}</div>
      <span class="bd ${d.has_open?'ok':'no'}">${d.has_open?'有数据':'暂无'}</span>
    </button>
    <button class="sb ${S.shells.has('SILENT')?'on':''}" onclick="toggleShell('SILENT')">
      <div class="t">静音</div><div class="d">${esc(d.s_lwh||'尺寸 TBA')}</div>
      <span class="bd ${d.has_silent?'ok':'no'}">${d.has_silent?'有数据':'暂无'}</span>
    </button>
  </div>`;
}
function toggleShell(k){
  if(S.shells.has(k))S.shells.delete(k);else S.shells.add(k);
  if(S.shells.size===0)toast('至少要选一个：开架或静音');
  renderShellbar();renderNonstdBar();renderEditor();renderPreview();
}
function curShell(){ return S.shells.has('OPEN')?'O':(S.shells.has('SILENT')?'S':'O'); }

/* ---------- 编辑区 ---------- */
function val(key){
  const d=S.data;
  if(key==='lwh'||key==='wt'||key==='tank'){
    const pre=curShell()==='O'?'o_':'s_';
    return d[pre+key]??'';
  }
  return d[key]??'';
}
function setVal(key,v){
  const d=S.data;
  if(key==='lwh'||key==='wt'||key==='tank'){
    const pre=curShell()==='O'?'o_':'s_';
    d[pre+key]=v||null;
  }else{
    d[key]=v||null;
  }
}
function changed(key){
  const o=S.orig;
  if(key==='lwh'||key==='wt'||key==='tank'){
    const pre=curShell()==='O'?'o_':'s_';
    return (o[pre+key]??'')!==(S.data[pre+key]??'');
  }
  return (o[key]??'')!==(S.data[key]??'');
}
/* 字段 key -> 中文名（用于非标差异标注） */
const FIELD_LABEL={};
GROUPS.forEach(g=>g.f.forEach(([k,label])=>FIELD_LABEL[k]=label));

/* 渲染非标提示条：列出与标准单不一致的参数 */
function renderNonstdBar(){
  const bar=$('nstdbar');
  if(!bar)return;
  const d=S.diff;
  if(S.kind!=='nonstd' || !d){
    bar.style.display='none';bar.innerHTML='';return;
  }
  const diffs=d.diffs||[];
  let h='';
  if(!d.base){
    // 中高压机型结构上没有对应的低压标准单，属正常状态，不当报错
    const hv=isHVData();
    h = hv
      ? '<span class="nb-t">⚠ 非标参数单</span>　<span style="color:#8a5a00">中高压机型，标准库中无对应标准单可比对</span>'
      : '<span class="nb-w">⚠ 找不到基准标准单</span>　'+(d.note||'');
  }else if(!diffs.length){
    h='<span class="nb-t">⚠ 非标参数单</span>　基准：'+esc(d.base)+
      '　<span style="color:#16a34a">当前无参数差异</span>';
  }else{
    h='<span class="nb-t">⚠ 非标参数单</span>　基准：'+esc(d.base)+
      '　<span style="color:#b45309">不一致 '+diffs.length+' 项</span><br>';
    h+=diffs.map(x=>{
      const nm=FIELD_LABEL[x.field]||x.field;
      const a=(x.std==null||x.std==='')?'（空）':x.std;
      const b=(x.nonstd==null||x.nonstd==='')?'（空）':x.nonstd;
      return '<span class="nb-i"><b>'+esc(nm)+'</b> '+esc(String(a))+' → '+esc(String(b))+'</span>';
    }).join('');
  }
  bar.innerHTML=h;
  bar.style.display='block';
}

/* 当前参数单是否中高压（std_v 线电压 >= 1000V） */
function isHVData(){
  const d=S.data||{};
  const sv=String(d.std_v||'');
  const m=sv.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1])>=1000 : false;
}

function renderEditor(){
  if(!S.data){return;}
  let h='';
  GROUPS.forEach((g,gi)=>{
    const shNote=g.shellAware?`（当前：${curShell()==='O'?'开架':'静音'}）`:'';
    h+=`<div class="grp">
      <div class="grp-t" onclick="toggleGrp(${gi})"><span class="ar">${g.open?'▼':'▶'}</span>${g.t}${shNote}</div>
      <div class="grp-b" id="grp${gi}" style="display:${g.open?'block':'none'}">`;
    g.f.forEach(([k,label])=>{
      const isNum=['prp_kva','prp_kw','eps_kva','eps_kw','rpm'].includes(k);
      h+=`<div class="fld">
        <label>${label}</label>
        <input type="${isNum?'number':'text'}" value="${esc(val(k))}"
          class="${changed(k)?'chg':''}"
          oninput="onEdit('${k}',this.value,this)" ${isNum?'step="any"':''}>
      </div>`;
    });
    h+=`</div></div>`;
  });
  $('editor').innerHTML=h;
}
const _open={};
function toggleGrp(gi){
  const el=$('grp'+gi);if(!el)return;
  el.style.display = el.style.display==='none'?'block':'none';
}
function buildNewName(){
  if(!S.isNew)return;
  const d=S.data;
  const mc=(d.model||d.parsed&&d.parsed.model_code||'').trim();
  if(!mc){d.name='新参数单';return;}
  const v=(d.std_v||'').trim();
  const vol=v?(' ('+v+')'):'';
  const em=(d.e_model||'').trim();
  d.name=mc+vol+(em?' ['+em+']':'');
}
function onEdit(k,v,el){
  setVal(k,v);
  if(S.isNew){
    if(k==='model'&&S.data.parsed)S.data.parsed.model_code=v;
    if(k==='std_v'||k==='e_model'||k==='model')buildNewName();
    $('editName').textContent=S.data.name||'（新增）';
  }
  // 只刷新预览 + 当前输入框的改动标记（不整块重绘，避免失焦）
  // 2026-11-17 修：原来用隐式全局 event.target，严格模式/Safari 会报错，改为显式传 el
  if(el) el.classList.toggle('chg',changed(k));
  renderPreview();
}

/* ---------- 右侧实时预览（真模板渲染，所见即所得） ---------- */
let _pvTimer=null, _pvSeq=0, _pvLastKey='';
function pvKey(){
  const d=S.data||{};
  return JSON.stringify([S.kind,S.cur,S.isNew,curShell(),d]);
}
function renderPreview(force){
  if(!S.data){return;}
  const k=pvKey();
  if(!force && k===_pvLastKey){return;}
  _pvLastKey=k;
  const seq=++_pvSeq;
  const box=$('preview');
  // 首次 / 强制刷新显示遮罩，否则原地更新避免闪烁
  if(!box.querySelector('.pv-live')){
    box.innerHTML=`<div class="pv-bar">
      <button class="btn primary" onclick="doExport()">生成正式 PDF</button>
      <button class="btn" onclick="doSave()">保存</button>
      <button class="btn" onclick="renderPreview(true)">刷新预览</button>
      <span class="hint">预览＝真实模板渲染，与导出 PDF 一致</span>
    </div><div class="pv-live"><div class="pv-wait">渲染中…</div></div>`;
  }else{
    const live=box.querySelector('.pv-live');
    if(!live.querySelector('img')) live.innerHTML='<div class="pv-wait">渲染中…</div>';
  }
  clearTimeout(_pvTimer);
  _pvTimer=setTimeout(async()=>{
    try{
      const r=await (await fetch('api/preview',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({kind:S.kind,name:S.isNew?'':S.cur,shell:curShell()==='O'?'OPEN':'SILENT',data:S.data,lang:S.lang})})).json();
      if(seq!==_pvSeq)return;           // 有更新的请求，丢弃本次
      if(!r.ok){ $('preview').querySelector('.pv-live').innerHTML=`<div class="pv-wait" style="color:#b91c1c">预览失败：${esc(r.error||'')}</div>`; return; }
      const pages=(r.pages||[]).map((u,i)=>`<div class="pv-page"><div class="pv-no">第 ${i+1} 页</div><img src="${u.replace(/^\//,'')}" alt="第${i+1}页"></div>`).join('');
      $('preview').querySelector('.pv-live').innerHTML=pages||'<div class="pv-wait">无页面</div>';
    }catch(e){
      if(seq!==_pvSeq)return;
      const l=$('preview').querySelector('.pv-live');
      if(l) l.innerHTML=`<div class="pv-wait" style="color:#b91c1c">预览失败：${esc(e.message)}</div>`;
    }
  }, 600);
}

/* ---------- 导出 PDF ---------- */
async function doExport(){
  if(!S.cur)return;
  if(S.shells.size===0){toast('先选开架或静音');return;}
  $('mask').classList.add('on');$('maskTxt').textContent='正在生成 PDF…';
  try{
    const r=await (await fetch('api/export',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:S.kind,name:S.cur,shell:curShell()==='O'?'OPEN':'SILENT',lang:S.lang})})).json();
    if(r.ok){
      // 直接下载，不跳打印界面
      const fn=String(r.pdf||'').split('/').pop();
      const a=document.createElement('a');
      a.href='api/download/'+encodeURIComponent(fn)
             + (r.dlname?('?as='+encodeURIComponent(r.dlname)):'');
      a.download=r.dlname||'';
      document.body.appendChild(a);a.click();a.remove();
      toast('PDF 开始下载');
    }
    else toast('失败：'+(r.error||''));
  }catch(e){toast('失败：'+e.message);}
  $('mask').classList.remove('on');
}

/* ---------- 保存 / 新增 / 删除 ---------- */
async function doSave(){
  if(!S.data){toast('先选一个参数单');return;}
  if(!S.admin){toast('请先点右上角「管理员登录」');return;}
  if(S.isNew && S.deriveBase){return doSaveDerive();}
  const payload={kind:S.kind,name:S.isNew?'':S.cur,is_new:!!S.isNew,data:S.data};
  const r=await (await fetch('api/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)})).json().catch(e=>({ok:false,error:e.message}));
  if(!r.ok){toast('保存失败：'+(r.error||''));return;}
  toast(r.action==='created'?'已新增':'已保存');
  const savedName=r.name;
  S.isNew=false;
  await doSearch(S.page);
  await openDetail(savedName);
}
async function doDelete(){
  if(!S.cur||S.isNew){toast('先选一个参数单');return;}
  if(!S.admin){toast('请先点右上角「管理员登录」');return;}
  if(!confirm('确定删除？\n'+S.cur+'\n（删标准单时其下非标会一起删）'))return;
  const r=await (await fetch('api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kind:S.kind,name:S.cur})})).json().catch(e=>({ok:false,error:e.message}));
  if(!r.ok){toast('删除失败：'+(r.error||''));return;}
  toast('已删除'+(r.deleted_nonstd&&r.deleted_nonstd.length?`（含非标 ${r.deleted_nonstd.length} 条）`:''));
  S.cur=null;S.data=null;S.isNew=false;
  $('editor').innerHTML='<div class="empty">左边选一个参数单</div>';
  $('shellbar').innerHTML='';$('preview').innerHTML='<div class="empty">预览区</div>';
  $('editName').textContent='';$('editOps').style.display='none';
  await doSearch(1);
}
function doNew(){
  if(!S.admin){toast('请先点右上角「管理员登录」');return;}
  S.isNew=true;S.cur=null;S.diff=null;
  const blank={name:'',model:'',family_name:'',version:'',cur_freq:'50Hz',shell_code:'A',shell_name:'A',
    images:{OPEN:null,SILENT:null},parsed:{model_code:'',voltage:null,variant:null,engine_model:null},
    has_open:true,has_silent:false};
  ['prp_kva','prp_kw','eps_kva','eps_kw','std_v','opt_v','rpm','e_brand','e_model','e_fuel','e_asp',
   'e_cool','e_gov','e_cyl','displ','cyl_arr','bore','ex_t','ex_f','ex_bp','fu_res','fu_max','co_air',
   'co_oil','co_cool','el_v','el_bat','el_alt','in_flt','in_res','in_flow','in_t','g_insul','g_exc',
   'g_lead','g_conn','g_pitch','g_phase','g_brg','o_lwh','o_wt','o_tank','s_lwh','s_wt','s_tank'
  ].forEach(k=>blank[k]='');
  blank.name='新参数单';
  S.data=blank;S.orig=JSON.parse(JSON.stringify(blank));
  S.shells=new Set(['OPEN']);
  $('editName').textContent='（新增）';
  $('editOps').style.display='flex';
  S.diff=null;
  renderShellbar();renderNonstdBar();renderEditor();renderPreview();
  toast('填好型号/电压/发动机后点「保存」');
}

/* ---------- 由标准单派生非标 ---------- */
async function doDerive(){
  if(!S.admin){toast('请先点右上角「管理员登录」');return;}
  // 步骤1：选基准标准单
  const q=prompt('输入标准单的型号 / 发动机型号（如 AF2270 或 AF11D5）');
  if(q===null)return;
  const r=await (await fetch('api/std_index?q='+encodeURIComponent(q||'')+'&limit=30')).json();
  if(!r.ok||!r.items.length){toast('没找到标准单');return;}
  const lines=r.items.map((it,i)=>`${i+1}. ${it.name}  —  ${it.e_model||'—'} / ${it.prp_kva||'—'}kVA`).join('\n');
  const pick=prompt('选一个作基准（输入序号）：\n\n'+lines, '1');
  if(!pick)return;
  const idx=parseInt(pick,10)-1;
  if(isNaN(idx)||!r.items[idx]){toast('序号不对');return;}
  const base=r.items[idx];
  // 步骤2：非标单名称
  const nm=prompt('非标单名称（留空 = 「'+base.name+' · 非标」）','');
  if(nm===null)return;
  // 步骤3：读基准详情，放进编辑器，标记为非标新增
  const d=await (await fetch('api/detail?kind=std&name='+encodeURIComponent(base.name))).json();
  if(!d.ok){toast('读取基准失败');return;}
  S.isNew=true;S.deriveBase=base.name;
  S.data=JSON.parse(JSON.stringify(d.data));
  S.orig=JSON.parse(JSON.stringify(d.data));
  S.cur=null;S.diff=null;
  if(nm.trim())S.data.name=nm.trim();
  $('editName').textContent=S.data.name;
  $('editOps').style.display='flex';
  S.shells=new Set(S.data.has_open?['OPEN']:['SILENT']);
  renderShellbar();renderNonstdBar();renderEditor();renderPreview();
  toast('已载入基准参数，改完点「保存」= 生成非标单');
}
async function doSaveDerive(){
  const r=await (await fetch('api/derive',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({base:S.deriveBase,name:S.data.name,data:S.data})})).json()
    .catch(e=>({ok:false,error:e.message}));
  if(!r.ok){toast('派生失败：'+(r.error||''));return;}
  toast('非标单已生成：'+r.name);
  S.isNew=false;S.deriveBase=null;
  await setKind('nonstd');
  await openDetail(r.name);
}

/* ---------- 登录 ---------- */
async function doLogin(){
  if(S.admin){
    await fetch('api/logout',{method:'POST'});S.admin=false;
    $('who').textContent='游客模式';$('loginBtn').textContent='管理员登录';toast('已退出');return;
  }
  const u=prompt('管理员账号');if(!u)return;
  const p=prompt('密码');if(!p)return;
  const r=await (await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:u,password:p})})).json();
  if(r.ok){S.admin=true;$('who').textContent='管理员：bob';$('loginBtn').textContent='退出登录';toast('登录成功');_pvLastKey='';if(S.data)renderPreview(true);}
  else toast('账号或密码不对');
}

(async()=>{
  // 读回上次选择的语言
  try{
    const lg=localStorage.getItem('ps_lang');
    if(lg==='en'||lg==='zh'){ S.lang=lg; const sel=$('fLang'); if(sel) sel.value=lg; }
  }catch(e){}
  const r=await (await fetch('api/whoami')).json();
  S.admin=r.admin;$('who').textContent=r.admin?'管理员：'+r.user:'游客模式';
  $('loginBtn').textContent=r.admin?'退出登录':'管理员登录';
  await loadDict();await doSearch();
})();
</script>
